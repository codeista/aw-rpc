name: Advance Wars CI/CD

on:
  push:
    branches: [ claude-v1 ]  # TEMPORARY: Only test claude-v1 branch
  pull_request:
    branches: [ claude-v1 ]  # TEMPORARY: Only test claude-v1 branch

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10']

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest coverage
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=flask-env
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=flask-env
    
    - name: Run CI Test Suite
      run: |
        python test_ci.py
    
    - name: Run Enhanced Unit Tests
      run: |
        python -m unittest test_unittest.py -v
    
    - name: Run Integration Tests (if server available)
      run: |
        timeout 30s python app.py &
        sleep 5
        python -c "
        import requests
        try:
            requests.get('http://localhost:5000', timeout=2)
            print('Server started, running integration tests')
            import subprocess
            subprocess.run(['python', 'test_enhanced_integration.py'], timeout=60)
        except:
            print('Server not available, skipping integration tests')
        "
      continue-on-error: true
    
    - name: Generate Coverage Report
      run: |
        coverage run -m unittest discover
        coverage report -m
        coverage xml
    
    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Upload Test Reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-reports-${{ matrix.python-version }}
        path: |
          ci_report.json
          junit_report.xml
          test_report.json
          coverage.xml
    
    - name: Upload Test Interface
      uses: actions/upload-artifact@v3
      with:
        name: test-interface
        path: test_interface.html

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Run Security Scan
      run: |
        pip install safety bandit
        safety check
        bandit -r . -f json -o bandit_report.json || true
    
    - name: Upload Security Reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: bandit_report.json

  performance:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install locust
    
    - name: Run Performance Tests
      run: |
        timeout 30s python app.py &
        sleep 5
        # Basic performance test
        python -c "
        import time
        import requests
        start = time.time()
        for i in range(10):
            try:
                requests.post('http://localhost:5000/api', 
                             json={'jsonrpc': '2.0', 'method': 'game_create', 'params': {'token': f'perf_{i}'}, 'id': i},
                             timeout=2)
            except: pass
        duration = time.time() - start
        print(f'Performance test: 10 requests in {duration:.2f}s')
        "
