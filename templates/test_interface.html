<!DOCTYPE html>
<html>
<head>
    <title>AW-RPC Test Suite</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            padding: 0; 
            margin: 0;
            background: #0f0f23;
            color: #ccc;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 320px 320px 1fr;
            gap: 20px;
            height: calc(100vh - 40px);
        }
        
        .header {
            grid-column: 1 / -1;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
        }
        
        .header h1 {
            margin: 0;
            font-size: 1.4em;
            font-weight: 300;
            color: #fff;
        }
        
        /* Control Panel */
        .control-panel {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
        }
        
        .control-panel h2 {
            margin: 0 0 15px 0;
            font-size: 1.1em;
            color: #fff;
            font-weight: 400;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .test-button {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .test-button:hover {
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.3);
            transform: translateX(2px);
        }
        
        .test-button.running {
            background: rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.5);
        }
        
        .button-icon {
            font-size: 16px;
        }
        
        /* Status Panel */
        .status-panel {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
        }
        
        .status-panel h2 {
            margin: 0 0 15px 0;
            font-size: 1.1em;
            color: #fff;
            font-weight: 400;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .status-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            margin-bottom: 6px;
            background: rgba(255,255,255,0.05);
            border-radius: 5px;
            font-size: 13px;
        }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #666;
        }
        
        .status-indicator.ready {
            background: #666;
        }
        
        .status-indicator.running {
            background: #3b82f6;
            animation: pulse 1.5s infinite;
        }
        
        .status-indicator.passed {
            background: #10b981;
        }
        
        .status-indicator.failed {
            background: #ef4444;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        /* Results Panel */
        .results-panel {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            line-height: 1.5;
        }
        
        .results-panel h2 {
            margin: 0 0 15px 0;
            font-size: 1.1em;
            color: #fff;
            font-weight: 400;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        
        .server-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        
        .status-online {
            color: #10b981;
        }
        
        .status-offline {
            color: #ef4444;
        }
        
        .divider {
            width: 100%;
            height: 1px;
            background: rgba(255,255,255,0.1);
            margin: 15px 0;
        }
        
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 15px;
        }
        
        .action-button {
            padding: 6px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }
        
        .action-button:hover {
            background: rgba(255,255,255,0.15);
        }
        
        .result-entry {
            margin-bottom: 10px;
            padding: 8px;
            background: rgba(255,255,255,0.03);
            border-radius: 4px;
        }
        
        .result-timestamp {
            color: #666;
            font-size: 11px;
        }
        
        .result-content {
            margin-top: 5px;
            white-space: pre-wrap;
            color: #e0e0e0;
        }
        
        .test-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .summary-card {
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 6px;
            text-align: center;
        }
        
        .summary-number {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        
        .summary-label {
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 AW-RPC Test Suite</h1>
            <div class="server-status" id="server-status">
                <span>Server:</span>
                <span id="status-text" class="status-offline">Checking...</span>
            </div>
        </div>
        
        <!-- Control Panel -->
        <div class="control-panel">
            <h2>Test Controls</h2>
            
            <button class="test-button" onclick="runTest('combat', 'test_combat_system.py')">
                <span class="button-icon">⚔️</span>
                <span>Combat System</span>
            </button>
            
            <button class="test-button" onclick="runTest('economic', 'test_economic_system.py')">
                <span class="button-icon">💰</span>
                <span>Economic System</span>
            </button>
            
            <button class="test-button" onclick="runTest('movement', 'test_movement_system.py')">
                <span class="button-icon">🚶</span>
                <span>Movement System</span>
            </button>
            
            <button class="test-button" onclick="runTest('victory', 'test_victory_conditions.py')">
                <span class="button-icon">🏆</span>
                <span>Victory Conditions</span>
            </button>
            
            <button class="test-button" onclick="runTest('transport', 'test_transport_final.py')">
                <span class="button-icon">🚢</span>
                <span>Transport System</span>
            </button>
            
            <button class="test-button" onclick="runTest('integration', 'updated_test_phase1.py')">
                <span class="button-icon">🔧</span>
                <span>Integration Tests</span>
            </button>
            
            <button class="test-button" onclick="runTest('multiplayer', 'test_multiplayer_armies.py')">
                <span class="button-icon">👥</span>
                <span>Multiplayer Armies</span>
            </button>
            
            <div class="divider"></div>
            
            <button class="test-button" onclick="runAllTests()" style="background: rgba(59, 130, 246, 0.2); border-color: rgba(59, 130, 246, 0.5);">
                <span class="button-icon">🚀</span>
                <span>Run All Tests</span>
            </button>
            
            <div class="divider"></div>
            
            <div class="action-buttons">
                <button class="action-button" onclick="window.open('/test_optimized', '_blank')">
                    🎯 Test Map
                </button>
                <button class="action-button" onclick="window.open('/sprite_test', '_blank')">
                    🎨 Sprite Test
                </button>
                <button class="action-button" onclick="window.open('/test_triangle', '_blank')">
                    🔺 Triangle (3P)
                </button>
                <button class="action-button" onclick="window.open('/test_cross', '_blank')">
                    ➕ Cross (4P)
                </button>
                <button class="action-button" onclick="window.open('/test_pentagon', '_blank')">
                    ⭐ Pentagon (5P)
                </button>
                <button class="action-button" onclick="window.open('/api/browse', '_blank')">
                    📚 API Docs
                </button>
                <button class="action-button" onclick="clearResults()">
                    🗑️ Clear
                </button>
                <button class="action-button" onclick="checkServerStatus()">
                    🔄 Refresh
                </button>
            </div>
        </div>
        
        <!-- Status Panel -->
        <div class="status-panel">
            <h2>Test Status</h2>
            
            <div class="test-summary">
                <div class="summary-card">
                    <div class="summary-number" id="total-tests">0</div>
                    <div class="summary-label">Total</div>
                </div>
                <div class="summary-card">
                    <div class="summary-number" id="passed-tests" style="color: #10b981;">0</div>
                    <div class="summary-label">Passed</div>
                </div>
                <div class="summary-card">
                    <div class="summary-number" id="failed-tests" style="color: #ef4444;">0</div>
                    <div class="summary-label">Failed</div>
                </div>
            </div>
            
            <div id="status-list">
                <div class="status-item">
                    <span>⚔️ Combat System</span>
                    <span class="status-indicator ready" id="status-combat"></span>
                </div>
                <div class="status-item">
                    <span>💰 Economic System</span>
                    <span class="status-indicator ready" id="status-economic"></span>
                </div>
                <div class="status-item">
                    <span>🚶 Movement System</span>
                    <span class="status-indicator ready" id="status-movement"></span>
                </div>
                <div class="status-item">
                    <span>🏆 Victory Conditions</span>
                    <span class="status-indicator ready" id="status-victory"></span>
                </div>
                <div class="status-item">
                    <span>🚢 Transport System</span>
                    <span class="status-indicator ready" id="status-transport"></span>
                </div>
                <div class="status-item">
                    <span>🔧 Integration Tests</span>
                    <span class="status-indicator ready" id="status-integration"></span>
                </div>
                <div class="status-item">
                    <span>👥 Multiplayer Armies</span>
                    <span class="status-indicator ready" id="status-multiplayer"></span>
                </div>
            </div>
        </div>
        
        <!-- Results Panel -->
        <div class="results-panel">
            <h2>Test Results</h2>
            <div id="results-content">
                <div style="color: #666; text-align: center; margin-top: 50px;">
                    Select a test to run or click "Run All Tests"
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let testStats = {
            total: 0,
            passed: 0,
            failed: 0
        };
        
        // Check server status on load
        checkServerStatus();
        setInterval(checkServerStatus, 30000);
        
        function checkServerStatus() {
            fetch('/api/browse')
            .then(response => {
                const statusEl = document.getElementById('status-text');
                if (response.ok) {
                    statusEl.textContent = 'Online';
                    statusEl.className = 'status-online';
                } else {
                    statusEl.textContent = 'Offline';
                    statusEl.className = 'status-offline';
                }
            })
            .catch(error => {
                const statusEl = document.getElementById('status-text');
                statusEl.textContent = 'Offline';
                statusEl.className = 'status-offline';
            });
        }
        
        function updateTestStats() {
            document.getElementById('total-tests').textContent = testStats.total;
            document.getElementById('passed-tests').textContent = testStats.passed;
            document.getElementById('failed-tests').textContent = testStats.failed;
        }
        
        function setTestStatus(testName, status) {
            const indicator = document.getElementById(`status-${testName}`);
            if (indicator) {
                indicator.className = `status-indicator ${status}`;
            }
        }
        
        function addResult(content, isError = false) {
            const resultsDiv = document.getElementById('results-content');
            const timestamp = new Date().toLocaleTimeString();
            
            const entry = document.createElement('div');
            entry.className = 'result-entry';
            entry.innerHTML = `
                <div class="result-timestamp">[${timestamp}]</div>
                <div class="result-content" style="color: ${isError ? '#ef4444' : 'inherit'}">${content}</div>
            `;
            
            resultsDiv.appendChild(entry);
            resultsDiv.scrollTop = resultsDiv.scrollHeight;
        }
        
        function clearResults() {
            document.getElementById('results-content').innerHTML = `
                <div style="color: #666; text-align: center; margin-top: 50px;">
                    Results cleared. Select a test to run.
                </div>
            `;
            
            // Reset all status indicators
            ['combat', 'economic', 'movement', 'victory', 'transport', 'integration', 'multiplayer'].forEach(test => {
                setTestStatus(test, 'ready');
            });
            
            // Reset stats
            testStats = { total: 0, passed: 0, failed: 0 };
            updateTestStats();
        }
        
        function runTest(testName, scriptName) {
            // Update UI
            setTestStatus(testName, 'running');
            addResult(`🏃 Running ${testName} tests...`);
            
            // Disable button
            const buttons = document.querySelectorAll('.test-button');
            buttons.forEach(btn => {
                if (btn.textContent.toLowerCase().includes(testName)) {
                    btn.classList.add('running');
                    btn.disabled = true;
                }
            });
            
            // Run test
            fetch('/run_test', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ script: scriptName })
            })
            .then(response => response.text())
            .then(result => {
                const success = !result.includes('FAILED') && !result.includes('Traceback') && (result.includes('OK') || result.includes('passed') || result.includes('Success'));
                
                // Update status
                setTestStatus(testName, success ? 'passed' : 'failed');
                
                // Update stats
                testStats.total++;
                if (success) {
                    testStats.passed++;
                } else {
                    testStats.failed++;
                }
                updateTestStats();
                
                // Add result
                addResult(`${success ? '✅' : '❌'} ${testName} test completed\n${result}`, !success);
                
                // Re-enable button
                buttons.forEach(btn => {
                    if (btn.textContent.toLowerCase().includes(testName)) {
                        btn.classList.remove('running');
                        btn.disabled = false;
                    }
                });
            })
            .catch(error => {
                setTestStatus(testName, 'failed');
                testStats.total++;
                testStats.failed++;
                updateTestStats();
                addResult(`❌ Error running ${testName} test: ${error.message}`, true);
                
                // Re-enable button
                const buttons = document.querySelectorAll('.test-button');
                buttons.forEach(btn => {
                    if (btn.textContent.toLowerCase().includes(testName)) {
                        btn.classList.remove('running');
                        btn.disabled = false;
                    }
                });
            });
        }
        
        async function runAllTests() {
            clearResults();
            addResult('🚀 Starting all tests...');
            
            const tests = [
                { name: 'combat', script: 'test_combat_system.py' },
                { name: 'economic', script: 'test_economic_system.py' },
                { name: 'movement', script: 'test_movement_system.py' },
                { name: 'victory', script: 'test_victory_conditions.py' },
                { name: 'transport', script: 'test_transport_final.py' },
                { name: 'integration', script: 'updated_test_phase1.py' },
                { name: 'multiplayer', script: 'test_multiplayer_armies.py' }
            ];
            
            // Disable all buttons
            document.querySelectorAll('.test-button').forEach(btn => btn.disabled = true);
            
            for (const test of tests) {
                setTestStatus(test.name, 'running');
                addResult(`\n🏃 Running ${test.name} tests...`);
                
                try {
                    const response = await fetch('/run_test', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ script: test.script })
                    });
                    
                    const result = await response.text();
                    const success = response.ok && !result.includes('FAILED') && !result.includes('Traceback') && (result.includes('OK') || result.includes('passed') || result.includes('Success'));
                    
                    setTestStatus(test.name, success ? 'passed' : 'failed');
                    
                    testStats.total++;
                    if (success) {
                        testStats.passed++;
                    } else {
                        testStats.failed++;
                    }
                    updateTestStats();
                    
                    addResult(`${success ? '✅' : '❌'} ${test.name} test completed`, !success);
                    
                    // Add the actual test output
                    if (result && result.trim()) {
                        addResult(result, !success);
                    }
                    
                } catch (error) {
                    setTestStatus(test.name, 'failed');
                    testStats.total++;
                    testStats.failed++;
                    updateTestStats();
                    addResult(`❌ Error running ${test.name} test: ${error.message}`, true);
                }
            }
            
            // Re-enable buttons
            document.querySelectorAll('.test-button').forEach(btn => btn.disabled = false);
            
            // Summary
            addResult(`\n📊 Test Summary: ${testStats.passed}/${testStats.total} passed`);
            if (testStats.failed === 0) {
                addResult('🎉 All tests passed!');
            } else {
                addResult(`⚠️ ${testStats.failed} test(s) failed`, true);
            }
        }
    </script>
</body>
</html>
