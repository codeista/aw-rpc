<!DOCTYPE html>
<html>
<head>
    <title>Test Sprite Mapping - Advance Wars</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #2a2a2a;
            color: #fff;
            font-family: monospace;
        }
        #game-container {
            display: inline-block;
            background: #000;
            padding: 10px;
            border: 2px solid #444;
        }
        #game-canvas {
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }
        #controls {
            margin-top: 10px;
            padding: 10px;
            background: #333;
            border: 1px solid #555;
        }
        button {
            padding: 5px 10px;
            margin: 0 5px;
            background: #555;
            color: #fff;
            border: 1px solid #777;
            cursor: pointer;
        }
        button:hover {
            background: #666;
        }
        #info {
            margin-top: 10px;
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #333;
            font-size: 12px;
        }
        #tile-info {
            color: #0f0;
        }
        .funds-display {
            margin-top: 5px;
        }
        .funds-display div {
            margin: 2px 0;
        }
        #modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #333;
            padding: 20px;
            border: 2px solid #555;
            z-index: 1000;
        }
        #modal select {
            width: 200px;
            padding: 5px;
            margin: 10px 0;
            background: #222;
            color: #fff;
            border: 1px solid #444;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="controls">
            <button id="end-turn">End Turn</button>
            <button id="test-3player">Test 3 Players</button>
            <button id="test-4player">Test 4 Players</button>
            <button id="test-custom">Test Custom Colors</button>
        </div>
        <div id="info">
            <div>Current Turn: <span id="current-turn">-</span> | Day: <span id="day">-</span></div>
            <div class="funds-display">
                <!-- Dynamic player funds will be inserted here -->
            </div>
            <div>Hover: <span id="tile-info"></span></div>
        </div>
    </div>
    
    <div id="modal">
        <h3>Create Unit</h3>
        <select id="unit-select"></select>
        <div>
            <button id="create">Create</button>
            <button id="cancel">Cancel</button>
        </div>
    </div>
    
    <script src="/static/lib/socket.io.min.js"></script>
    <script>
        // Placeholder token for testing
        const TOKEN = 'test-token';
        
        // Test functions for multi-player
        document.getElementById('test-3player').addEventListener('click', () => {
            // Simulate 3-player game state
            if (window.game && window.game.board) {
                window.game.board.players = {
                    0: { id: 0, name: "Alice", color: "Crimson", sprite_color: "RED" },
                    1: { id: 1, name: "Bob", color: "Navy", sprite_color: "BLUE" },
                    2: { id: 2, name: "Charlie", color: "Forest", sprite_color: "GREEN" }
                };
                window.game.board.turn_order = [0, 1, 2];
                window.game.board.current_player = 0;
                window.spriteMapper.initFromGameState(window.game.board);
                window.game.render();
                console.log('Switched to 3-player mode');
            }
        });
        
        document.getElementById('test-4player').addEventListener('click', () => {
            // Simulate 4-player game state
            if (window.game && window.game.board) {
                window.game.board.players = {
                    0: { id: 0, name: "North", color: "Red", sprite_color: "RED" },
                    1: { id: 1, name: "South", color: "Blue", sprite_color: "BLUE" },
                    2: { id: 2, name: "East", color: "Green", sprite_color: "GREEN" },
                    3: { id: 3, name: "West", color: "Yellow", sprite_color: "YELLOW" }
                };
                window.game.board.turn_order = [0, 1, 2, 3];
                window.game.board.current_player = 0;
                window.spriteMapper.initFromGameState(window.game.board);
                window.game.render();
                console.log('Switched to 4-player mode');
            }
        });
        
        document.getElementById('test-custom').addEventListener('click', () => {
            // Test custom colors
            if (window.game && window.game.board) {
                window.game.board.players = {
                    0: { id: 0, name: "Fire Nation", color: "Orange", sprite_color: "RED" },
                    1: { id: 1, name: "Water Tribe", color: "Cyan", sprite_color: "BLUE" },
                    2: { id: 2, name: "Earth Kingdom", color: "Brown", sprite_color: "GREEN" },
                    3: { id: 3, name: "Air Nomads", color: "White", sprite_color: "YELLOW" }
                };
                window.game.board.turn_order = [0, 1, 2, 3];
                window.game.board.current_player = 0;
                window.spriteMapper.initFromGameState(window.game.board);
                window.game.render();
                console.log('Switched to custom colors mode');
            }
        });
    </script>
    <script src="/static/js/minimal_game_v2.js"></script>
</body>
</html>
