<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AW-RPC - Advance Wars Strategy Game</title>
    <link rel="stylesheet" type="text/css" href="/static/css/modal.css">
    <style>
        /* ===== RESET & BASE STYLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(90deg, #2c3e50 0%, #34495e 100%);
            padding: 8px 15px;
            border-bottom: 2px solid #3498db;
            box-shadow: 0 1px 5px rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 18px;
            font-weight: bold;
            color: #ecf0f1;
            margin-bottom: 2px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .header p {
            font-size: 11px;
            color: #bdc3c7;
            margin-bottom: 5px;
        }

        .header .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .game-token {
            background: rgba(52, 152, 219, 0.2);
            padding: 4px 8px;
            border-radius: 12px;
            border: 1px solid #3498db;
            font-family: monospace;
            font-size: 11px;
        }

        .api-link {
            color: #3498db;
            text-decoration: none;
            padding: 4px 8px;
            border: 1px solid #3498db;
            border-radius: 3px;
            font-size: 11px;
            transition: all 0.3s ease;
        }

        .api-link:hover {
            background: #3498db;
            color: white;
            transform: translateY(-1px);
        }

        /* ===== MAIN LAYOUT ===== */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 220px;
            gap: 8px;
            padding: 8px;
            min-height: calc(100vh - 60px);
        }

        @media (max-width: 1200px) {
            .main-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto;
            }
        }

        /* ===== GAME BOARD SECTION ===== */
        .game-board-section {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }

        .board-container {
            position: relative;
            background: #000;
            border-radius: 5px;
            border: 1px solid #34495e;
            overflow: hidden;
            margin-bottom: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        #draw {
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 5px;
        }
        
        #draw canvas {
            border: 1px solid #34495e;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            max-width: 100%;
            height: auto;
        }

        .info-panel {
            background: rgba(44, 62, 80, 0.3);
            border-radius: 5px;
            padding: 6px;
            border: 1px solid rgba(255,255,255,0.1);
            margin-top: 6px;
            max-height: 120px;
            overflow-y: auto;
        }

        .info-panel h3 {
            color: #3498db;
            margin-bottom: 3px;
            font-size: 11px;
        }

        #infobox {
            font-size: 9px;
            line-height: 1.3;
            color: #ffffff;
            background: rgba(0,0,0,0.2);
            padding: 4px;
            border-radius: 3px;
            white-space: pre-wrap;
        }

        /* ===== CONTROL PANEL ===== */
        .control-panel {
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            padding: 6px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: calc(100vh - 80px);
            overflow-y: auto;
        }

        .control-section {
            background: rgba(255,255,255,0.03);
            border-radius: 3px;
            padding: 4px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .control-section h3 {
            color: #3498db;
            margin-bottom: 4px;
            font-size: 10px;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .control-section h3::before {
            content: "▶";
            color: #e74c3c;
        }

        /* ===== BUTTONS ===== */
        .btn {
            padding: 3px 6px;
            border: none;
            border-radius: 3px;
            font-size: 9px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.2px;
            margin: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .btn-primary {
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            color: white;
        }

        .btn-success {
            background: linear-gradient(45deg, #27ae60, #229954);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(45deg, #f39c12, #e67e22);
            color: white;
        }

        .control-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
        }

        /* ===== CHECKBOXES & TOGGLES ===== */
        .toggle-container {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .toggle-item {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 2px;
            border-radius: 2px;
            transition: background 0.3s ease;
            font-size: 9px;
        }

        .toggle-item:hover {
            background: rgba(255,255,255,0.05);
        }

        .toggle-switch {
            position: relative;
            width: 28px;
            height: 14px;
            background: #34495e;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toggle-switch.active {
            background: #3498db;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 1px;
            left: 1px;
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .toggle-switch.active::after {
            transform: translateX(14px);
        }

        /* ===== CHAT SECTION ===== */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 80px;
        }

        .chat-messages {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border-radius: 3px;
            padding: 3px;
            margin-bottom: 3px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
            font-family: monospace;
            font-size: 8px;
            line-height: 1.2;
            color: #fff;
            resize: none;
        }

        .chat-messages:focus {
            outline: none;
            border-color: #3498db;
        }

        .chat-input-container {
            display: flex;
            gap: 2px;
        }

        .chat-input {
            flex: 1;
            padding: 2px 4px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 2px;
            color: white;
            font-size: 9px;
        }

        .chat-input::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .chat-input:focus {
            outline: none;
            border-color: #3498db;
            background: rgba(255,255,255,0.15);
        }

        /* ===== JSON DEBUG SECTION ===== */
        .json-container {
            height: 60px;
        }

        .json-display {
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 3px;
            padding: 3px;
            color: #2ecc71;
            font-family: 'Courier New', monospace;
            font-size: 7px;
            resize: none;
            overflow-y: auto;
        }

        .json-display:focus {
            outline: none;
            border-color: #3498db;
        }

        /* ===== MODAL IMPROVEMENTS ===== */
        .modal {
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        /* ===== RESPONSIVE DESIGN ===== */
        @media (max-width: 768px) {
            .main-container {
                padding: 5px;
                gap: 8px;
            }
            
            .header .game-info {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .control-buttons {
                grid-template-columns: 1fr;
            }
        }

        /* ===== LOADING ANIMATION ===== */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(52, 152, 219, 0.3);
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="game-info">
            <div>
                <h1>🎮 AW-RPC</h1>
                <p>Advanced Wars Real-Time Strategy</p>
            </div>
            <div class="game-token">Game: {{token}}</div>
            
            <!-- Display Options in Header -->
            <div style="display: flex; align-items: center; gap: 8px; font-size: 9px;">
                <div style="display: flex; align-items: center; gap: 3px;">
                    <div class="toggle-switch active" id="toggleShowMap" onclick="toggleDisplay('map')"></div>
                    <label>🗺️ Map</label>
                </div>
                <div style="display: flex; align-items: center; gap: 3px;">
                    <div class="toggle-switch active" id="toggleShowChat" onclick="toggleDisplay('chat')"></div>
                    <label>💬 Chat</label>
                </div>
                <div style="display: flex; align-items: center; gap: 3px;">
                    <div class="toggle-switch" id="toggleShowJson" onclick="toggleDisplay('json')"></div>
                    <label>📋 JSON</label>
                </div>
            </div>
            
            <!-- Graphics Options in Header -->
            <div style="display: flex; align-items: center; gap: 6px; font-size: 8px;">
                <div style="display: flex; align-items: center; gap: 2px;">
                    <label style="color: #bdc3c7;">Terrain:</label>
                    <select id="terrainTilesetSelect" style="padding: 1px; border-radius: 2px; border: 1px solid #bdc3c7; font-size: 8px; background: rgba(255,255,255,0.1); color: white;" onchange="changeTileset()">
                        <option value="transparent" style="color: black;">AW:DS (T)</option>
                        <option value="normal" style="color: black;">AW:DS (N)</option>
                        <option value="blackhole_transparent" style="color: black;">BH (T)</option>
                        <option value="blackhole_normal" style="color: black;">BH (N)</option>
                    </select>
                </div>
                <div style="display: flex; align-items: center; gap: 2px;">
                    <label style="color: #bdc3c7;">Units:</label>
                    <select id="unitTilesetSelect" style="padding: 1px; border-radius: 2px; border: 1px solid #bdc3c7; font-size: 8px; background: rgba(255,255,255,0.1); color: white;" onchange="changeTileset()">
                        <option value="blackhole_transparent" style="color: black;">BH (T)</option>
                        <option value="blackhole_normal" style="color: black;">BH (N)</option>
                    </select>
                </div>
            </div>
            
            <a href="/api/browse" target="_blank" class="api-link">📡 Browse API</a>
            
            <!-- Hidden checkboxes for compatibility with render.js -->
            <input type="checkbox" id="inputshowmap" checked style="display: none;">
            <input type="checkbox" id="inputshowchat" checked style="display: none;">
            <input type="checkbox" id="inputshowjson" style="display: none;">
        </div>
    </header>

    <!-- Main Game Container -->
    <div class="main-container">
        <!-- Game Board Section -->
        <section class="game-board-section">
            <div class="board-container">
                <div id="draw" x-token="{{token}}"></div>
            </div>
            <div class="info-panel">
                <h3>📊 Game Information</h3>
                <div id="infobox">Select a unit or tile to view details</div>
            </div>
        </section>

        <!-- Control Panel -->
        <aside class="control-panel">
            <!-- Game Controls -->
            <div class="control-section">
                <h3>🎮 Game Controls</h3>
                <div class="control-buttons">
                    <button class="btn btn-success buttonendturn" onclick="armyEndTurn();">
                        ⏭️ End Turn
                    </button>
                    <button class="btn btn-danger buttonendgame" onclick="endGame();">
                        🛑 End Game
                    </button>
                    <button class="btn btn-primary buttonrerender" onclick="rerender();">
                        🔄 Re-render
                    </button>
                    <button class="btn btn-warning" onclick="showGameStats();">
                        📈 Stats
                    </button>
                </div>
                <div id="gamebox" style="margin-top: 4px; padding: 3px; background: rgba(0,0,0,0.2); border-radius: 2px; min-height: 18px; font-size: 8px;">
                    <small style="color: #bdc3c7;">Game status</small>
                </div>
            </div>

            <!-- Chat Section -->
            <div class="control-section" id="chatSection">
                <h3>💬 Battle Communications</h3>
                <div class="chat-container">
                    <textarea class="chat-messages" id="textareachat" readonly></textarea>
                    <div class="chat-input-container">
                        <input type="text" class="chat-input" id="inputchat" placeholder="Type your message...">
                        <button class="btn btn-primary" id="buttonchat">Send</button>
                    </div>
                </div>
            </div>

            <!-- Debug JSON Section -->
            <div class="control-section" id="jsonSection">
                <h3>🔧 Debug Console</h3>
                <div class="json-container">
                    <textarea class="json-display" id="code" readonly placeholder="Game state data will appear here..."></textarea>
                </div>
            </div>
        </aside>
    </div>

    <!-- Create Unit Modal -->
    <div id="modalcreate" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3 style="margin-bottom: 15px; color: #3498db;">🏭 Create Unit</h3>
            <select id="selectcreate" style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #bdc3c7;">
            </select>
            <button type="button" class="btn btn-success" id="buttoncreate" style="width: 100%;">Create Unit</button>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay" style="display: none;">
        <div>
            <div class="loading-spinner"></div>
            <p style="margin-top: 20px; color: #3498db;">Loading game...</p>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.js"></script>
    <script src="/static/js/two.min.js"></script>
    <script src="/static/js/render.js"></script>
    <script src="/static/js/transport_integration.js"></script>

    <script>
        // Modern UI Enhancement Scripts
        
        // Toggle display sections
        function toggleDisplay(section) {
            const toggle = document.getElementById(`toggleShow${section.charAt(0).toUpperCase() + section.slice(1)}`);
            const sectionElement = document.getElementById(`${section}Section`);
            
            toggle.classList.toggle('active');
            
            if (section === 'map') {
                // Handle map display toggle
                const inputshowmap = document.getElementById('inputshowmap');
                if (inputshowmap) {
                    inputshowmap.checked = toggle.classList.contains('active');
                    inputshowmap.onchange();
                }
            } else if (section === 'chat') {
                const inputshowchat = document.getElementById('inputshowchat');
                if (inputshowchat) {
                    inputshowchat.checked = toggle.classList.contains('active');
                }
                sectionElement.style.display = toggle.classList.contains('active') ? 'block' : 'none';
            } else if (section === 'json') {
                const inputshowjson = document.getElementById('inputshowjson');
                if (inputshowjson) {
                    inputshowjson.checked = toggle.classList.contains('active');
                }
                sectionElement.style.display = toggle.classList.contains('active') ? 'block' : 'none';
            }
        }

        // Show game statistics
        function showGameStats() {
            // This would show a modal or panel with game statistics
            alert('Game statistics feature coming soon!');
        }

        // Enhanced chat functionality
        document.addEventListener('DOMContentLoaded', function() {
            // Hide only JSON section by default, keep chat visible
            const jsonSection = document.getElementById('jsonSection');
            if (jsonSection) jsonSection.style.display = 'none';
            
            // The original render.js handles chat functionality, so we don't override it
            // But we need to clean up any JSON that might appear in chat messages
            
            // Override ONLY the message handler to clean JSON from chat messages
            // DO NOT interfere with other socket handlers (update, connect, disconnect)
            setTimeout(function() {
                if (typeof io !== 'undefined') {
                    const socket = io('/');
                    // Only remove and replace the 'message' handler, leave others intact
                    socket.off('message');
                    socket.on('message', (msg) => {
                        var textareachat = document.getElementById('textareachat');
                        // Clean the message - only show the actual text, not JSON
                        let cleanMsg = msg;
                        if (typeof msg === 'object') {
                            cleanMsg = msg.message || msg.msg || JSON.stringify(msg);
                        } else if (typeof msg === 'string') {
                            // If it looks like JSON, try to extract just the message
                            try {
                                const parsed = JSON.parse(msg);
                                cleanMsg = parsed.message || parsed.msg || msg;
                            } catch (e) {
                                cleanMsg = msg; // Not JSON, use as-is
                            }
                        }
                        textareachat.value = textareachat.value + cleanMsg + '\n';
                        textareachat.scrollTop = textareachat.scrollHeight;
                    });
                }
            }, 300); // Increased delay to ensure render.js handlers are set up first
        });

        // Show loading overlay during operations
        function showLoading() {
            document.getElementById('loadingOverlay').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        // Hide loading on page load
        window.addEventListener('load', hideLoading);

        // Tileset management function
        function changeTileset() {
            // Force a re-render to apply new tileset
            if (typeof rerender === 'function') {
                rerender();
            }
        }
    </script>
</body>
</html>
