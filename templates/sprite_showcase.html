<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advance Wars Sprite Showcase</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #2a2a2a;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        
        h1 {
            text-align: center;
            color: #3498db;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .army-section {
            background: rgba(0,0,0,0.3);
            border: 2px solid #3498db;
            border-radius: 10px;
            margin: 20px auto;
            padding: 20px;
            max-width: 1200px;
        }
        
        .army-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 5px;
        }
        
        .red-title { background: #e74c3c; }
        .blue-title { background: #3498db; }
        .green-title { background: #27ae60; }
        .yellow-title { background: #f39c12; }
        .grey-title { background: #7f8c8d; }
        
        .sprite-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .unit-card {
            background: rgba(0,0,0,0.5);
            border: 1px solid #555;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }
        
        .unit-name {
            font-weight: bold;
            margin-bottom: 10px;
            color: #ecf0f1;
        }
        
        .sprite-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 10px 0;
            align-items: center;
        }
        
        .sprite-box {
            text-align: center;
        }
        
        .sprite-canvas {
            border: 1px solid #666;
            background: #1a1a1a;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            width: 64px;
            height: 64px;
        }
        
        .sprite-label {
            font-size: 12px;
            color: #bdc3c7;
            margin-top: 5px;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 18px;
        }
        
        .controls {
            text-align: center;
            margin: 20px 0;
        }
        
        .controls select {
            padding: 8px 15px;
            font-size: 16px;
            background: #34495e;
            color: white;
            border: 1px solid #3498db;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .info-box {
            background: rgba(52, 152, 219, 0.2);
            border: 1px solid #3498db;
            border-radius: 5px;
            padding: 15px;
            margin: 20px auto;
            max-width: 800px;
        }
        
        .hp-indicator {
            position: absolute;
            bottom: 0;
            right: 0;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 2px 4px;
            font-size: 10px;
            border-radius: 2px;
        }
        
        .sprite-container {
            position: relative;
            display: inline-block;
        }
    </style>
</head>
<body>
    <h1>🎮 Advance Wars Unit Sprite Showcase</h1>
    
    <div class="info-box">
        <p><strong>Sprite States:</strong></p>
        <ul>
            <li><strong>Idle/Available:</strong> Unit can perform actions (normal colors)</li>
            <li><strong>Unavailable:</strong> Unit has acted or can't act (grayed out)</li>
            <li><strong>HP Indicators:</strong> Shows unit health (1-10)</li>
        </ul>
    </div>
    
    <div class="controls">
        <label for="tilesetSelect">Unit Tileset: </label>
        <select id="tilesetSelect" onchange="loadSprites()">
            <option value="/static/img/aw2_blackhole_units_map_transparent.png">AW2 Blackhole Transparent</option>
            <option value="/static/img/aw2_blackhole_units_map.png">AW2 Blackhole Normal</option>
        </select>
    </div>
    
    <div id="showcase" class="loading">
        Loading sprite data...
    </div>

    <script>
        const SPRITESIZE = 16;
        const SCALE = 4; // Scale up for better visibility
        
        // All unit types from the game
        const UNIT_TYPES = [
            'INFANTRY', 'MECH', 'RECON', 'TANK', 'MEDIUMTANK', 'NEOTANK', 'MEGATANK',
            'APC', 'ARTILLERY', 'ROCKET', 'ANTIAIR', 'MISSILE',
            'FIGHTER', 'BOMBER', 'BCOPTER', 'TCOPTER', 'STEALTH', 'BLACKBOMB',
            'BATTLESHIP', 'CRUISER', 'LANDER', 'SUB', 'CARRIER', 'BLACKBOAT',
            'PIPERUNNER'
        ];
        
        // Armies to display
        const ARMIES = ['RED', 'BLUE', 'GREEN', 'YELLOW', 'GREY'];
        
        let spriteCorrections = null;
        let spriteSheet = null;
        
        async function loadSpriteCorrections() {
            try {
                const response = await fetch('/templates/sprite_corrections_config.json');
                const data = await response.json();
                spriteCorrections = data.corrections;
                console.log('Sprite corrections loaded');
            } catch (error) {
                console.error('Failed to load sprite corrections:', error);
            }
        }
        
        async function loadSprites() {
            const showcaseDiv = document.getElementById('showcase');
            showcaseDiv.innerHTML = '<div class="loading">Loading sprites...</div>';
            
            // Load sprite corrections if not already loaded
            if (!spriteCorrections) {
                await loadSpriteCorrections();
            }
            
            // Load sprite sheet
            const tilesetPath = document.getElementById('tilesetSelect').value;
            spriteSheet = new Image();
            
            spriteSheet.onload = () => {
                console.log('Sprite sheet loaded');
                renderShowcase();
            };
            
            spriteSheet.onerror = () => {
                showcaseDiv.innerHTML = '<div class="loading">Error loading sprite sheet!</div>';
            };
            
            spriteSheet.src = tilesetPath;
        }
        
        function getSpriteCoordinates(unitType, army, state) {
            const spriteKey = `${unitType}_${army}_${state}_0`;
            
            if (spriteCorrections && spriteCorrections[state] && spriteCorrections[state][spriteKey]) {
                return spriteCorrections[state][spriteKey];
            }
            
            // Fallback coordinates
            console.warn(`No sprite data for ${spriteKey}`);
            return null;
        }
        
        function drawSprite(canvas, unitType, army, state, hp = 10) {
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = false;
            
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Get sprite coordinates
            const coords = getSpriteCoordinates(unitType, army, state);
            if (!coords) {
                ctx.fillStyle = '#ff0000';
                ctx.fillText('?', 25, 35);
                return;
            }
            
            // Draw unit sprite
            ctx.drawImage(
                spriteSheet,
                coords.x, coords.y, SPRITESIZE, SPRITESIZE,
                0, 0, canvas.width, canvas.height
            );
            
            // Draw HP indicator if damaged
            if (hp < 10 && state === 'idle') {
                const hpCategory = 'hp_indicators';
                const hpKey = `${hpCategory}_${hp - 1}`;
                
                if (spriteCorrections && spriteCorrections[hpCategory] && spriteCorrections[hpCategory][hpKey]) {
                    const hpCoords = spriteCorrections[hpCategory][hpKey];
                    
                    // Draw HP in corner
                    const hpSize = 8 * SCALE;
                    ctx.drawImage(
                        spriteSheet,
                        hpCoords.x, hpCoords.y, 8, 8,
                        canvas.width - hpSize - 2, canvas.height - hpSize - 2, hpSize, hpSize
                    );
                }
            }
        }
        
        function renderShowcase() {
            const showcaseDiv = document.getElementById('showcase');
            showcaseDiv.innerHTML = '';
            
            // Create section for each army
            ARMIES.forEach(army => {
                const armySection = document.createElement('div');
                armySection.className = 'army-section';
                
                const title = document.createElement('div');
                title.className = `army-title ${army.toLowerCase()}-title`;
                title.textContent = `${army} ARMY`;
                armySection.appendChild(title);
                
                const grid = document.createElement('div');
                grid.className = 'sprite-grid';
                
                // Create cards for each unit type
                UNIT_TYPES.forEach(unitType => {
                    const card = document.createElement('div');
                    card.className = 'unit-card';
                    
                    const unitName = document.createElement('div');
                    unitName.className = 'unit-name';
                    unitName.textContent = unitType;
                    card.appendChild(unitName);
                    
                    const spriteRow = document.createElement('div');
                    spriteRow.className = 'sprite-row';
                    
                    // Show idle state
                    const idleBox = createSpriteBox(unitType, army, 'idle', 'Available');
                    spriteRow.appendChild(idleBox);
                    
                    // Show unavailable state
                    const unavailBox = createSpriteBox(unitType, army, 'unavailable', 'Unavailable');
                    spriteRow.appendChild(unavailBox);
                    
                    // Show damaged state (5 HP)
                    const damagedBox = createSpriteBox(unitType, army, 'idle', '5 HP', 5);
                    spriteRow.appendChild(damagedBox);
                    
                    card.appendChild(spriteRow);
                    grid.appendChild(card);
                });
                
                armySection.appendChild(grid);
                showcaseDiv.appendChild(armySection);
            });
        }
        
        function createSpriteBox(unitType, army, state, label, hp = 10) {
            const box = document.createElement('div');
            box.className = 'sprite-box';
            
            const container = document.createElement('div');
            container.className = 'sprite-container';
            
            const canvas = document.createElement('canvas');
            canvas.className = 'sprite-canvas';
            canvas.width = SPRITESIZE * SCALE;
            canvas.height = SPRITESIZE * SCALE;
            
            drawSprite(canvas, unitType, army, state, hp);
            
            container.appendChild(canvas);
            box.appendChild(container);
            
            const labelDiv = document.createElement('div');
            labelDiv.className = 'sprite-label';
            labelDiv.textContent = label;
            box.appendChild(labelDiv);
            
            return box;
        }
        
        // Initialize on page load
        window.onload = () => {
            loadSprites();
        };
    </script>
</body>
</html>
