<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advance Wars - Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #fff;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            height: 100vh;
        }

        /* Left sidebar - Player info */
        .sidebar {
            width: 300px;
            background: #0f0f0f;
            border-right: 2px solid #333;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .game-info {
            padding: 20px;
            border-bottom: 2px solid #333;
        }

        .game-info h2 {
            font-size: 1.2em;
            margin-bottom: 10px;
            color: #4a9eff;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            font-size: 0.9em;
        }

        .info-label {
            color: #888;
        }

        /* Player cards */
        .players-section {
            flex: 1;
            overflow-y: auto;
        }

        .player-card {
            margin: 15px;
            padding: 15px;
            background: #1a1a1a;
            border-radius: 10px;
            border: 2px solid #333;
            transition: all 0.3s ease;
        }

        .player-card.active {
            border-color: #4a9eff;
            background: #1a2332;
            box-shadow: 0 0 20px rgba(74, 158, 255, 0.3);
        }

        .player-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .player-name {
            font-weight: bold;
            font-size: 1.1em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .player-indicator {
            width: 30px;
            height: 30px;
            border-radius: 5px;
            display: inline-block;
        }

        .player-indicator.red { background: #e74c3c; }
        .player-indicator.blue { background: #3498db; }
        .player-indicator.green { background: #2ecc71; }
        .player-indicator.yellow { background: #f1c40f; }

        .player-status {
            font-size: 0.8em;
            padding: 2px 8px;
            border-radius: 12px;
            background: #333;
        }

        .player-status.active {
            background: #4a9eff;
            color: #fff;
        }

        .player-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .stat-box {
            background: #0f0f0f;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.2em;
            font-weight: bold;
            color: #4a9eff;
        }

        .stat-label {
            font-size: 0.8em;
            color: #888;
            margin-top: 2px;
        }

        /* Main game area */
        .game-main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Top bar */
        .top-bar {
            background: #0f0f0f;
            padding: 10px 20px;
            border-bottom: 2px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .turn-indicator {
            font-size: 1.2em;
            font-weight: bold;
        }

        .game-controls {
            display: flex;
            gap: 10px;
        }

        .control-btn {
            padding: 8px 16px;
            background: #333;
            border: none;
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9em;
        }

        .control-btn:hover {
            background: #444;
            transform: translateY(-1px);
        }

        .control-btn.end-turn {
            background: #e74c3c;
        }

        .control-btn.end-turn:hover {
            background: #c0392b;
        }

        /* Game canvas area */
        .canvas-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        #gameCanvas {
            max-width: 100%;
            max-height: 100%;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        /* Bottom info panel */
        .bottom-panel {
            background: #0f0f0f;
            padding: 15px 20px;
            border-top: 2px solid #333;
            display: flex;
            align-items: center;
            gap: 20px;
            min-height: 80px;
        }

        .tile-info {
            flex: 1;
        }

        .unit-info {
            flex: 1;
            text-align: center;
        }

        .action-info {
            flex: 1;
            text-align: right;
        }

        /* Loading screen */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-content {
            text-align: center;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #4a9eff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            
            .game-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <h2>Loading Game...</h2>
        </div>
    </div>

    <div class="game-container">
        <!-- Left Sidebar -->
        <div class="sidebar">
            <div class="game-info">
                <h2>Game Info</h2>
                <div class="info-row">
                    <span class="info-label">Turn:</span>
                    <span id="turnNumber">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Day:</span>
                    <span id="dayNumber">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Map:</span>
                    <span id="mapName">-</span>
                </div>
            </div>

            <div class="players-section" id="playersSection">
                <!-- Player cards will be generated here -->
            </div>
        </div>

        <!-- Main Game Area -->
        <div class="game-main">
            <!-- Top Bar -->
            <div class="top-bar">
                <div class="turn-indicator" id="turnIndicator">
                    Waiting for game data...
                </div>
                <div class="game-controls">
                    <button class="control-btn" onclick="showMenu()">Menu</button>
                    <button class="control-btn" onclick="toggleFullscreen()">Fullscreen</button>
                    <button class="control-btn end-turn" onclick="endTurn()">End Turn</button>
                </div>
            </div>

            <!-- Game Canvas -->
            <div class="canvas-container">
                <canvas id="gameCanvas"></canvas>
            </div>

            <!-- Bottom Panel -->
            <div class="bottom-panel">
                <div class="tile-info" id="tileInfo">
                    Hover over a tile for information
                </div>
                <div class="unit-info" id="unitInfo">
                    <!-- Unit details -->
                </div>
                <div class="action-info" id="actionInfo">
                    <!-- Current action -->
                </div>
            </div>
        </div>
    </div>

    <!-- Load game modules -->
    <script>
        // Set game token before loading other scripts
        window.gameToken = window.location.pathname.split('/').pop();
    </script>
    <script src="/static/js/modules/network.js"></script>
    <script src="/static/js/modules/gameState.js"></script>
    <script src="/static/js/modules/gameActions.js"></script>
    <script src="/static/js/game.js"></script>
    
    <script>
        // Get game token from URL
        const gameToken = window.location.pathname.split('/').pop();
        
        // Initialize game
        window.addEventListener('load', async () => {
            try {
                // Set token for RPC calls
                if (window.setGameToken) {
                    window.setGameToken(gameToken);
                }

                // Load initial game state
                await updateGameState();
                
                // Hide loading overlay
                document.getElementById('loadingOverlay').style.display = 'none';
                
                // Start periodic updates
                setInterval(updateGameState, 5000); // Update every 5 seconds
            } catch (error) {
                console.error('Failed to initialize game:', error);
                alert('Failed to load game. Please refresh the page.');
            }
        });

        async function updateGameState() {
            try {
                const response = await fetch('/api', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        jsonrpc: '2.0',
                        method: 'game_board',
                        params: { token: gameToken },
                        id: 1
                    })
                });

                const result = await response.json();
                if (result.result) {
                    updateUI(result.result);
                }
            } catch (error) {
                console.error('Failed to update game state:', error);
            }
        }

        function updateUI(board) {
            // Update game info
            document.getElementById('turnNumber').textContent = board.current_player + 1;
            document.getElementById('dayNumber').textContent = board.days;
            
            // Update turn indicator
            const currentPlayer = board.players[board.current_player];
            if (currentPlayer) {
                document.getElementById('turnIndicator').innerHTML = `
                    <span class="player-indicator ${currentPlayer.army.toLowerCase()}"></span>
                    ${currentPlayer.name}'s Turn
                `;
            }

            // Update player cards
            const playersSection = document.getElementById('playersSection');
            playersSection.innerHTML = '';
            
            board.players.forEach(player => {
                const isActive = player.id === board.current_player;
                const playerCard = document.createElement('div');
                playerCard.className = `player-card ${isActive ? 'active' : ''}`;
                
                // Count units
                const unitCount = board.grid.filter(tile => 
                    tile.unit && tile.unit.player_id === player.id
                ).length;
                
                // Count properties
                const propertyCount = board.grid.filter(tile => 
                    tile.player_id === player.id && 
                    ['CITY', 'FACTORY', 'AIRPORT', 'PORT'].includes(tile.type)
                ).length;
                
                playerCard.innerHTML = `
                    <div class="player-header">
                        <div class="player-name">
                            <span class="player-indicator ${player.army.toLowerCase()}"></span>
                            ${player.name}
                        </div>
                        <div class="player-status ${isActive ? 'active' : ''}">
                            ${isActive ? 'ACTIVE' : 'WAITING'}
                        </div>
                    </div>
                    <div class="player-stats">
                        <div class="stat-box">
                            <div class="stat-value">${player.funds.toLocaleString()}</div>
                            <div class="stat-label">Funds</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${unitCount}</div>
                            <div class="stat-label">Units</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${propertyCount}</div>
                            <div class="stat-label">Properties</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">+${propertyCount * 1000}</div>
                            <div class="stat-label">Income</div>
                        </div>
                    </div>
                `;
                
                playersSection.appendChild(playerCard);
            });

            // Update the main game board (handled by game.js)
            if (window.update) {
                window.update();
            }
        }

        async function endTurn() {
            try {
                const response = await fetch('/api', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        jsonrpc: '2.0',
                        method: 'army_end_turn',
                        params: { token: gameToken },
                        id: 1
                    })
                });

                const result = await response.json();
                if (result.result) {
                    await updateGameState();
                }
            } catch (error) {
                console.error('Failed to end turn:', error);
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        function showMenu() {
            if (confirm('Return to main menu?')) {
                window.location.href = '/';
            }
        }
    </script>
</body>
</html>
