<!DOCTYPE html>
<html>
<head>
    <title>Modular System Test</title>
</head>
<body>
    <h1>Testing Modular Render System</h1>
    <div id="results"></div>
    
    <script src="/static/js/logger.js"></script>
    <script type="module">
        import { TILESIZE, uuidv4, getGameState } from '/static/js/modules/core.js';
        import { jsonrpc, initializeSocket } from '/static/js/modules/network.js';
        import { analyzeBoardState } from '/static/js/modules/testing.js';
        
        const results = document.getElementById('results');
        
        function addResult(text, success = true) {
            const div = document.createElement('div');
            div.style.color = success ? 'green' : 'red';
            div.textContent = (success ? '✅ ' : '❌ ') + text;
            results.appendChild(div);
        }
        
        // Test core module
        try {
            addResult(`TILESIZE = ${TILESIZE}`, TILESIZE === 16);
            addResult(`UUID generated: ${uuidv4()}`, true);
            addResult(`Game state initialized: ${JSON.stringify(getGameState())}`, true);
        } catch (e) {
            addResult(`Core module error: ${e.message}`, false);
        }
        
        // Test network module
        try {
            addResult('Network module loaded', true);
            addResult(`jsonrpc function exists: ${typeof jsonrpc}`, typeof jsonrpc === 'function');
        } catch (e) {
            addResult(`Network module error: ${e.message}`, false);
        }
        
        // Test testing module
        try {
            addResult('Testing module loaded', true);
            addResult(`analyzeBoardState function exists: ${typeof analyzeBoardState}`, typeof analyzeBoardState === 'function');
        } catch (e) {
            addResult(`Testing module error: ${e.message}`, false);
        }
        
        // Summary
        const summary = document.createElement('h2');
        summary.textContent = 'All modules loaded successfully!';
        summary.style.color = 'green';
        results.appendChild(summary);
    </script>
</body>
</html>
