<!DOCTYPE html>
<html>
<head>
    <title>2x Sprite Test</title>
    <style>
        body { background: #333; padding: 20px; }
        canvas { border: 1px solid white; display: block; margin: 20px; }
        .info { color: white; font-family: monospace; }
    </style>
</head>
<body>
    <div class="info">Testing 2x Sprite Rendering</div>
    <canvas id="test" width="640" height="480"></canvas>
    
    <script>
        const canvas = document.getElementById('test');
        const ctx = canvas.getContext('2d');
        
        // Load terrain tileset
        const img = new Image();
        img.src = '/static/img/sprites_2x/combined/terrain_tileset_2x.png';
        
        img.onload = async () => {
            // Load sprite map
            const response = await fetch('/static/img/sprites_2x/combined/terrain_tileset_2x_map.json');
            const spriteMap = await response.json();
            
            // Clear canvas
            ctx.fillStyle = '#222';
            ctx.fillRect(0, 0, 640, 480);
            
            // Test drawing some sprites
            const testSprites = ['PLAIN', 'SEA', 'WOOD', 'MOUNTAIN', 'CITY', 'RED_CITY'];
            let x = 20;
            let y = 20;
            
            testSprites.forEach(spriteName => {
                if (spriteMap[spriteName]) {
                    const sprite = spriteMap[spriteName];
                    
                    // Draw sprite
                    ctx.drawImage(
                        img,
                        sprite.x, sprite.y, sprite.w, sprite.h,
                        x, y, sprite.w, sprite.h
                    );
                    
                    // Label
                    ctx.fillStyle = 'white';
                    ctx.font = '12px monospace';
                    ctx.fillText(spriteName, x, y + sprite.h + 15);
                    
                    x += sprite.w + 20;
                    if (x > 500) {
                        x = 20;
                        y += 100;
                    }
                }
            });
            
            // Draw grid reference
            ctx.strokeStyle = 'yellow';
            ctx.beginPath();
            for (let i = 0; i <= 10; i++) {
                ctx.moveTo(20 + i * 32, 300);
                ctx.lineTo(20 + i * 32, 332);
                ctx.moveTo(20, 300 + i * 32);
                ctx.lineTo(52, 300 + i * 32);
            }
            ctx.stroke();
            
            ctx.fillStyle = 'yellow';
            ctx.fillText('32x32 grid reference', 20, 350);
        };
    </script>
</body>
</html>
