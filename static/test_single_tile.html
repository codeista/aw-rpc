<!DOCTYPE html>
<html>
<head>
    <title>Single Tile Test</title>
    <style>
        body { background: #333; padding: 20px; color: white; font-family: monospace; }
        #container { border: 2px solid white; display: inline-block; }
        .info { margin: 10px 0; }
    </style>
</head>
<body>
    <h2>Testing Single Tile with Two.js</h2>
    <div class="info">This should show a single PLAIN tile at 32x32 pixels</div>
    <div id="container"></div>
    <div class="info" id="status">Loading...</div>
    
    <script src="/static/js/two.min.js"></script>
    <script>
        async function testSingleTile() {
            const status = document.getElementById('status');
            
            try {
                // Create Two.js instance
                const two = new Two({
                    type: Two.Types.canvas,
                    width: 64,
                    height: 64
                }).appendTo(document.getElementById('container'));
                
                status.textContent = 'Two.js initialized';
                
                // Load sprite map
                const response = await fetch('/static/img/sprites_2x/combined/terrain_tileset_2x_map.json');
                const terrainMap = await response.json();
                
                status.textContent = 'Sprite map loaded';
                
                // Get PLAIN sprite info
                const plainSprite = terrainMap.PLAIN;
                if (!plainSprite) {
                    throw new Error('PLAIN sprite not found in map');
                }
                
                status.textContent = `PLAIN sprite found at (${plainSprite.x}, ${plainSprite.y})`;
                
                // Load tileset image
                const tilesetPath = '/static/img/sprites_2x/combined/terrain_tileset_2x.png';
                
                // Create texture with onload callback
                const texture = new Two.Texture(tilesetPath, function() {
                    status.textContent = 'Texture loaded, rendering...';
                    
                    // Set the offset to the center of the sprite in the texture
                    texture.offset = new Two.Vector(
                        plainSprite.x + plainSprite.w/2,
                        plainSprite.y + plainSprite.h/2
                    );
                    
                    // Create rectangle at center of canvas
                    const rect = two.makeRectangle(32, 32, 32, 32);
                    rect.fill = texture;
                    rect.stroke = 'red'; // Red border to see the rectangle
                    rect.linewidth = 2;
                    
                    // Update the scene
                    two.update();
                    
                    status.innerHTML = `
                        Rendered!<br>
                        Sprite position: (${plainSprite.x}, ${plainSprite.y})<br>
                        Sprite size: ${plainSprite.w}x${plainSprite.h}<br>
                        Texture offset: (${texture.offset.x}, ${texture.offset.y})
                    `;
                });
                
            } catch (error) {
                status.textContent = 'Error: ' + error.message;
                console.error(error);
            }
        }
        
        // Run test when page loads
        window.onload = testSingleTile;
    </script>
</body>
</html>
