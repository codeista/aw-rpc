<!DOCTYPE html>
<html>
<head>
    <title>Factory Click Test</title>
</head>
<body>
    <h1>Factory Click Test</h1>
    <p>This tests if the factory click issue is in the game logic or the UI.</p>
    
    <script>
        // Simulate the game conditions
        const board = {
            current_turn: 'RED',
            grid: [{
                x: 0, 
                y: 4,
                mapTile: {
                    type: 'FACTORY',
                    army: 'RED'
                },
                unit: null
            }]
        };
        
        const tile = board.grid[0];
        
        console.log('Test conditions:');
        console.log('tile.mapTile.type:', tile.mapTile.type);
        console.log('tile.mapTile.army:', tile.mapTile.army);
        console.log('board.current_turn:', board.current_turn);
        console.log('tile.unit:', tile.unit);
        
        // Test the condition
        if (tile.mapTile.type == 'FACTORY' &&
            tile.mapTile.army == board.current_turn &&
            tile.unit == null) {
            console.log('✅ Factory condition PASSED - unitCreate should be called');
        } else {
            console.log('❌ Factory condition FAILED');
        }
        
        // Test with different values
        console.log('\nTesting equality:');
        console.log("'FACTORY' == 'FACTORY':", 'FACTORY' == 'FACTORY');
        console.log("'RED' == 'RED':", 'RED' == 'RED');
        console.log("null == null:", null == null);
    </script>
</body>
</html>
