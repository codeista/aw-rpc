<!DOCTYPE html>
<html>
<head>
    <title>Verify New Tileset Mapping</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #2c3e50;
            color: #ecf0f1;
        }
        h1, h2 {
            text-align: center;
        }
        .section {
            background: rgba(0,0,0,0.3);
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        .tile-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        .tile-item {
            background: rgba(0,0,0,0.5);
            border: 1px solid #34495e;
            border-radius: 4px;
            padding: 10px;
            text-align: center;
        }
        .tile-display {
            background: repeating-conic-gradient(#7f8c8d 0% 25%, transparent 0% 50%) 50% / 8px 8px;
            display: inline-block;
            position: relative;
        }
        canvas {
            image-rendering: pixelated;
            display: block;
        }
        .label {
            font-size: 11px;
            color: #3498db;
            margin-top: 5px;
        }
        .info {
            font-size: 10px;
            color: #95a5a6;
        }
        .success { color: #2ecc71; }
        .error { color: #e74c3c; }
    </style>
</head>
<body>
    <h1>New AW2 Tileset Verification</h1>
    <p style="text-align: center;">Showing actual tile sizes as they appear in the new tileset</p>
    
    <div class="section">
        <h2>✅ Terrain Tiles (16x16 pixels)</h2>
        <div id="terrainTiles" class="tile-grid"></div>
    </div>
    
    <div class="section">
        <h2>🛤️ Road Tiles (8x8 pixels)</h2>
        <div id="roadTiles" class="tile-grid"></div>
    </div>
    
    <div class="section">
        <h2>🔧 Pipe Tiles (15x15 pixels)</h2>
        <div id="pipeTiles" class="tile-grid"></div>
    </div>
    
    <div class="section">
        <h2>🌊 Water/Beach/River Tiles (8x8 pixels)</h2>
        <div id="waterTiles" class="tile-grid"></div>
    </div>
    
    <div class="section">
        <h2>🏢 Building Tiles (8x16 pixels)</h2>
        <div id="buildingTiles" class="tile-grid"></div>
    </div>

    <script>
        const tileset = new Image();
        tileset.onload = displayAllTiles;
        tileset.src = '/static/img/Game Boy Advance - Advance Wars 2 Black Hole Rising - Overworld Tileset Buildings.png';
        
        function drawTile(x, y, width, height, scale = 4) {
            const canvas = document.createElement('canvas');
            canvas.width = width * scale;
            canvas.height = height * scale;
            
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = false;
            
            // Draw tile
            ctx.drawImage(tileset, x, y, width, height, 0, 0, canvas.width, canvas.height);
            
            // Make pink transparent
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            for (let i = 0; i < data.length; i += 4) {
                if (data[i] > 240 && data[i + 2] > 240 && data[i + 1] < 100) {
                    data[i + 3] = 0;
                }
            }
            
            ctx.putImageData(imageData, 0, 0);
            return canvas;
        }
        
        function createTileDisplay(name, x, y, width, height, info = '') {
            const item = document.createElement('div');
            item.className = 'tile-item';
            
            const display = document.createElement('div');
            display.className = 'tile-display';
            const canvas = drawTile(x, y, width, height);
            display.appendChild(canvas);
            
            const label = document.createElement('div');
            label.className = 'label';
            label.textContent = name;
            
            const infoDiv = document.createElement('div');
            infoDiv.className = 'info';
            infoDiv.textContent = info || `${width}x${height} at (${x},${y})`;
            
            item.appendChild(display);
            item.appendChild(label);
            item.appendChild(infoDiv);
            return item;
        }
        
        function displayAllTiles() {
            // Terrain Tiles (16x16) - These are correct
            const terrainContainer = document.getElementById('terrainTiles');
            const terrainTiles = [
                { name: 'PLAIN', x: 238, y: 18 },
                { name: 'WOOD', x: 238, y: 35 },
                { name: 'MOUNTAIN', x: 255, y: 18 },
                { name: 'VOLCANO', x: 255, y: 35 }
            ];
            
            terrainTiles.forEach(tile => {
                terrainContainer.appendChild(
                    createTileDisplay(tile.name, tile.x, tile.y, 16, 16)
                );
            });
            
            // Road Tiles (8x8) - From our mapping
            const roadContainer = document.getElementById('roadTiles');
            const roadTiles = [
                { name: 'ROAD_HORT', x: 0, y: 0 },
                { name: 'ROAD_VERT', x: 9, y: 0 },
                { name: 'ROAD_CORNER_NE', x: 18, y: 0 },
                { name: 'ROAD_CORNER_SE', x: 27, y: 0 },
                { name: 'ROAD_CORNER_SW', x: 36, y: 0 },
                { name: 'ROAD_CORNER_NW', x: 45, y: 0 },
                { name: 'ROAD_T_N', x: 54, y: 0 },
                { name: 'ROAD_T_E', x: 63, y: 0 },
                { name: 'ROAD_CROSS', x: 0, y: 9 },
                { name: 'ROAD_T_S', x: 9, y: 9 },
                { name: 'ROAD_T_W', x: 18, y: 9 }
            ];
            
            roadTiles.forEach(tile => {
                roadContainer.appendChild(
                    createTileDisplay(tile.name, tile.x, tile.y, 8, 8, '9x9 grid')
                );
            });
            
            // Pipe Tiles (15x15) - From our mapping
            const pipeContainer = document.getElementById('pipeTiles');
            const pipeTiles = [
                { name: 'PIPE_HORT', x: 167, y: 166 },
                { name: 'PIPE_VERT', x: 184, y: 166 },
                { name: 'PIPE_CORNER_NE', x: 201, y: 166 },
                { name: 'PIPE_CORNER_SE', x: 218, y: 166 },
                { name: 'PIPE_CORNER_SW', x: 167, y: 183 },
                { name: 'PIPE_CORNER_NW', x: 184, y: 183 },
                { name: 'PIPE_CROSS', x: 201, y: 183 },
                { name: 'PIPE_T_N', x: 218, y: 183 }
            ];
            
            pipeTiles.forEach(tile => {
                pipeContainer.appendChild(
                    createTileDisplay(tile.name, tile.x, tile.y, 15, 15, '17x17 grid')
                );
            });
            
            // Water/Beach Tiles (8x8) - From our corrected mapping
            const waterContainer = document.getElementById('waterTiles');
            const waterTiles = [
                // First water box
                { name: 'WATER_1', x: 42, y: 142 },
                { name: 'WATER_2', x: 51, y: 142 },
                { name: 'WATER_3', x: 42, y: 151 },
                { name: 'WATER_4', x: 51, y: 151 },
                // Beach samples
                { name: 'BEACH_N', x: 42, y: 160 },
                { name: 'BEACH_E', x: 51, y: 160 },
                { name: 'BEACH_S', x: 42, y: 169 },
                { name: 'BEACH_W', x: 51, y: 169 },
                // River samples
                { name: 'RIVER_1', x: 42, y: 233 },
                { name: 'RIVER_2', x: 51, y: 233 },
                // Reef
                { name: 'REEF', x: 42, y: 340 }
            ];
            
            waterTiles.forEach(tile => {
                waterContainer.appendChild(
                    createTileDisplay(tile.name, tile.x, tile.y, 8, 8, '9x9 grid')
                );
            });
            
            // Building Tiles (8x16) - From our mapping
            const buildingContainer = document.getElementById('buildingTiles');
            const buildingTiles = [
                // Red/Orange Star
                { name: 'HQ_RED', x: 480, y: 0 },
                { name: 'CITY_RED', x: 488, y: 0 },
                { name: 'BASE_RED', x: 496, y: 0 },
                { name: 'AIRPORT_RED', x: 504, y: 0 },
                { name: 'PORT_RED', x: 512, y: 0 },
                // Blue Moon
                { name: 'HQ_BLUE', x: 480, y: 54 },
                { name: 'CITY_BLUE', x: 488, y: 54 },
                { name: 'BASE_BLUE', x: 496, y: 54 },
                { name: 'AIRPORT_BLUE', x: 504, y: 54 },
                { name: 'PORT_BLUE', x: 512, y: 54 },
                // Yellow Comet
                { name: 'HQ_YELLOW', x: 480, y: 108 },
                { name: 'CITY_YELLOW', x: 488, y: 108 },
                // Green Earth
                { name: 'HQ_GREEN', x: 480, y: 162 },
                { name: 'CITY_GREEN', x: 488, y: 162 },
                // Neutral
                { name: 'CITY_NEUTRAL', x: 488, y: 280 },
                { name: 'BASE_NEUTRAL', x: 496, y: 280 }
            ];
            
            buildingTiles.forEach(tile => {
                buildingContainer.appendChild(
                    createTileDisplay(tile.name, tile.x, tile.y, 8, 16, 'Pink bg')
                );
            });
        }
    </script>
</body>
</html>
