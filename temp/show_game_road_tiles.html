<!DOCTYPE html>
<html>
<head>
    <title>Game Road Tiles from Tileset</title>
    <style>
        body { background: #333; color: white; font-family: Arial; padding: 20px; }
        .tile-grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        .tile-item { text-align: center; background: #222; padding: 10px; border-radius: 4px; }
        canvas { image-rendering: pixelated; display: block; margin: 0 auto 5px; }
        .label { font-size: 12px; color: #aaa; }
    </style>
</head>
<body>
    <h1>Current Game Road Tiles</h1>
    <div id="tileGrid" class="tile-grid"></div>

    <script>
        // From render_legacy.js - the game uses centered coordinates
        const centerX = 222.5;
        const centerY = 581.5;
        const SPRITESIZE = 16;
        
        // Road tile offsets from render_legacy.js
        const roadTiles = [
            { name: 'ROAD_HORT', xOffset: -42, yOffset: -64 },
            { name: 'ROAD_VERT', xOffset: -59, yOffset: -64 },
            { name: 'ROAD_NW', xOffset: -42, yOffset: -13 },
            { name: 'ROAD_NE', xOffset: -76, yOffset: -13 },
            { name: 'ROAD_SE', xOffset: -76, yOffset: -47 },
            { name: 'ROAD_SW', xOffset: -42, yOffset: -47 },
            { name: 'SWNRoad', xOffset: -93, yOffset: -47 },
            { name: 'NESRoad', xOffset: -110, yOffset: -47 },
            { name: 'WNERoad', xOffset: -110, yOffset: -81 },
            { name: 'ESWRoad', xOffset: -93, yOffset: -81 },
            { name: 'CRoad', xOffset: -59, yOffset: -30 },
            { name: 'HBridge', xOffset: -43, yOffset: -30 },
            { name: 'VBridge', xOffset: -92, yOffset: -30 }
        ];
        
        const tileset = new Image();
        tileset.onload = function() {
            const grid = document.getElementById('tileGrid');
            
            roadTiles.forEach(tile => {
                // Calculate actual coordinates
                const x = centerX - SPRITESIZE/2 + tile.xOffset;
                const y = centerY - SPRITESIZE/2 + tile.yOffset;
                
                const item = document.createElement('div');
                item.className = 'tile-item';
                
                const canvas = document.createElement('canvas');
                canvas.width = 64;
                canvas.height = 64;
                const ctx = canvas.getContext('2d');
                ctx.imageSmoothingEnabled = false;
                
                // Draw from the optimized tileset the game uses
                ctx.drawImage(tileset, x, y, 16, 16, 0, 0, 64, 64);
                
                const label = document.createElement('div');
                label.className = 'label';
                label.innerHTML = `${tile.name}<br>(${Math.round(x)}, ${Math.round(y)})`;
                
                item.appendChild(canvas);
                item.appendChild(label);
                grid.appendChild(item);
            });
        };
        
        // Use the optimized tileset that the game is currently using
        tileset.src = '/static/img/tileset_optimized.png';
    </script>
</body>
</html>
