<!DOCTYPE html>
<html>
<head>
    <title>AW2 RGB Map Tiles Showcase</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #1a1a2e;
            color: #eee;
        }
        .container {
            max-width: 1800px;
            margin: 0 auto;
        }
        h1, h2 {
            text-align: center;
            color: #3498db;
        }
        .stats-panel {
            background: rgba(0,0,0,0.5);
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }
        .stat-card {
            background: rgba(52, 152, 219, 0.2);
            padding: 15px 25px;
            border-radius: 6px;
            text-align: center;
            margin: 10px;
            min-width: 150px;
        }
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #3498db;
        }
        .stat-label {
            font-size: 14px;
            color: #7f8c8d;
            margin-top: 5px;
        }
        .category-section {
            margin: 40px 0;
        }
        .category-header {
            background: linear-gradient(135deg, rgba(52, 152, 219, 0.2), rgba(46, 204, 113, 0.2));
            padding: 15px 20px;
            border-radius: 6px;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .tile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
        }
        .tile-card {
            background: rgba(0,0,0,0.7);
            border: 2px solid #34495e;
            border-radius: 6px;
            padding: 10px;
            text-align: center;
            transition: all 0.2s;
            position: relative;
        }
        .tile-card:hover {
            transform: translateY(-3px);
            border-color: #3498db;
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
            z-index: 10;
        }
        .tile-display {
            background: repeating-conic-gradient(#444 0% 25%, #333 0% 50%) 50% / 16px 16px;
            margin: 0 auto 10px;
            position: relative;
            display: inline-block;
            border: 1px solid #555;
        }
        .tile-canvas {
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            display: block;
        }
        .tile-label {
            font-size: 12px;
            color: #3498db;
            margin: 5px 0;
            font-weight: bold;
        }
        .tile-info {
            font-size: 10px;
            color: #7f8c8d;
        }
        .army-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin: 0 2px;
        }
        .army-red { background: #e74c3c; }
        .army-blue { background: #3498db; }
        .army-green { background: #2ecc71; }
        .army-yellow { background: #f1c40f; }
        .army-grey { background: #95a5a6; }
        .controls {
            text-align: center;
            margin: 20px 0;
        }
        button {
            padding: 10px 20px;
            margin: 0 5px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #2980b9;
        }
        button.active {
            background: #2ecc71;
        }
        .preview-scene {
            background: rgba(0,0,0,0.5);
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }
        #sceneCanvas {
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            border: 2px solid #34495e;
            background: #1a1a2e;
        }
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 20px;
            color: #3498db;
        }
        .error {
            color: #e74c3c;
            text-align: center;
            padding: 20px;
        }
        .filter-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .filter-group {
            background: rgba(0,0,0,0.5);
            padding: 10px 15px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗺️ AW2 RGB Map Tiles Showcase</h1>
        <p style="text-align: center; color: #7f8c8d;">High-quality RGB tileset from Advance Wars 2: Black Hole Rising</p>
        
        <div class="stats-panel">
            <div class="stat-card">
                <div class="stat-value" id="totalTiles">0</div>
                <div class="stat-label">Total Tiles</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="uniqueBuildings">0</div>
                <div class="stat-label">Building Types</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="terrainTypes">0</div>
                <div class="stat-label">Terrain Types</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">125KB</div>
                <div class="stat-label">File Size</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">RGB</div>
                <div class="stat-label">Color Mode</div>
            </div>
        </div>

        <div class="controls">
            <button onclick="setZoom(2)" class="active">2x Zoom</button>
            <button onclick="setZoom(3)">3x Zoom</button>
            <button onclick="setZoom(4)">4x Zoom</button>
            <button onclick="createSampleMap()">Generate Sample Map</button>
        </div>

        <div class="filter-controls">
            <div class="filter-group">
                <label>Show: </label>
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="buildings">Buildings</button>
                <button class="filter-btn" data-filter="terrain">Terrain</button>
                <button class="filter-btn" data-filter="roads">Roads</button>
                <button class="filter-btn" data-filter="water">Water</button>
            </div>
        </div>

        <div id="loadingMsg" class="loading">Loading tileset...</div>
        <div id="errorMsg" class="error" style="display: none;"></div>
        
        <div id="tileCategories" style="display: none;">
            <!-- Categories will be populated here -->
        </div>

        <div class="preview-scene" style="display: none;">
            <h2>Sample Map Preview</h2>
            <canvas id="sceneCanvas"></canvas>
            <p style="color: #7f8c8d; margin-top: 10px;">A sample map showing various tile types in action</p>
        </div>
    </div>

    <script>
        let tileset = null;
        let tileMapping = null;
        let currentZoom = 2;
        let activeFilter = 'all';

        // Load tileset image
        const img = new Image();
        img.onload = async function() {
            tileset = img;
            await loadTileMapping();
            displayTiles();
            document.getElementById('loadingMsg').style.display = 'none';
            document.getElementById('tileCategories').style.display = 'block';
        };
        img.onerror = function() {
            showError('Failed to load tileset image');
        };
        img.src = '../static/img/Game Boy Advance - Advance Wars 2 Black Hole Rising - Overworld Tileset Buildings.png';

        async function loadTileMapping() {
            try {
                const response = await fetch('../static/img/aw2_tileset_labeled_mapping.json');
                tileMapping = await response.json();
                updateStats();
            } catch (error) {
                showError('Failed to load tile mapping: ' + error.message);
            }
        }

        function updateStats() {
            if (!tileMapping || !tileMapping.tiles) return;
            
            const tiles = Object.values(tileMapping.tiles);
            document.getElementById('totalTiles').textContent = tiles.length;
            
            const buildings = tiles.filter(t => t.category === 'buildings');
            const uniqueBuildings = new Set(buildings.map(b => Object.keys(tileMapping.tiles).find(k => tileMapping.tiles[k] === b).split('_')[0]));
            document.getElementById('uniqueBuildings').textContent = uniqueBuildings.size;
            
            const terrainTypes = tiles.filter(t => t.category === 'terrain').length;
            document.getElementById('terrainTypes').textContent = terrainTypes;
        }

        function displayTiles() {
            if (!tileMapping || !tileset) return;
            
            const container = document.getElementById('tileCategories');
            container.innerHTML = '';
            
            // Group tiles by category
            const categories = {};
            for (const [name, tile] of Object.entries(tileMapping.tiles)) {
                if (activeFilter !== 'all' && tile.category !== activeFilter) continue;
                
                if (!categories[tile.category]) {
                    categories[tile.category] = [];
                }
                categories[tile.category].push({ name, ...tile });
            }
            
            // Display each category
            const categoryIcons = {
                buildings: '🏢',
                terrain: '🌲',
                roads: '🛤️',
                pipes: '🔧',
                water: '🌊',
                rivers: '💧',
                bridges: '🌉',
                weather: '☁️',
                animations: '💥'
            };
            
            for (const [category, tiles] of Object.entries(categories)) {
                const section = document.createElement('div');
                section.className = 'category-section';
                
                const header = document.createElement('div');
                header.className = 'category-header';
                header.innerHTML = `${categoryIcons[category] || '📦'} ${category.charAt(0).toUpperCase() + category.slice(1)}`;
                section.appendChild(header);
                
                const grid = document.createElement('div');
                grid.className = 'tile-grid';
                
                // Sort tiles by name for consistent display
                tiles.sort((a, b) => a.name.localeCompare(b.name));
                
                tiles.forEach(tile => {
                    const card = createTileCard(tile);
                    grid.appendChild(card);
                });
                
                section.appendChild(grid);
                container.appendChild(section);
            }
        }

        function createTileCard(tile) {
            const card = document.createElement('div');
            card.className = 'tile-card';
            
            const display = document.createElement('div');
            display.className = 'tile-display';
            const displaySize = Math.max(tile.width, tile.height) * currentZoom;
            display.style.width = displaySize + 'px';
            display.style.height = displaySize + 'px';
            
            const canvas = document.createElement('canvas');
            canvas.className = 'tile-canvas';
            canvas.width = tile.width * currentZoom;
            canvas.height = tile.height * currentZoom;
            
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = false;
            
            if (tileset) {
                ctx.drawImage(
                    tileset,
                    tile.x, tile.y, tile.width, tile.height,
                    0, 0, canvas.width, canvas.height
                );
            }
            
            display.appendChild(canvas);
            card.appendChild(display);
            
            const label = document.createElement('div');
            label.className = 'tile-label';
            label.textContent = formatTileName(tile.name);
            card.appendChild(label);
            
            const info = document.createElement('div');
            info.className = 'tile-info';
            
            if (tile.army) {
                const armySpan = document.createElement('span');
                armySpan.className = `army-indicator army-${tile.army.toLowerCase()}`;
                info.appendChild(armySpan);
                info.appendChild(document.createTextNode(' ' + tile.army));
            } else {
                info.textContent = `${tile.width}×${tile.height}`;
            }
            
            card.appendChild(info);
            
            return card;
        }

        function formatTileName(name) {
            // Convert snake_case to Title Case
            return name.split('_').map(word => 
                word.charAt(0).toUpperCase() + word.slice(1)
            ).join(' ');
        }

        function setZoom(zoom) {
            currentZoom = zoom;
            document.querySelectorAll('.controls button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            displayTiles();
        }

        function showError(message) {
            document.getElementById('loadingMsg').style.display = 'none';
            const errorEl = document.getElementById('errorMsg');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }

        // Filter buttons
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('filter-btn')) {
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                e.target.classList.add('active');
                activeFilter = e.target.dataset.filter;
                displayTiles();
            }
        });

        function createSampleMap() {
            if (!tileset || !tileMapping) return;
            
            const canvas = document.getElementById('sceneCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 640;
            canvas.height = 480;
            
            ctx.imageSmoothingEnabled = false;
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Create a sample map layout
            const TILE_SIZE = 16;
            const SCALE = 2;
            
            // Draw grass background
            const grassTile = tileMapping.tiles['grass'] || tileMapping.tiles['plain'];
            if (grassTile) {
                for (let y = 0; y < canvas.height; y += TILE_SIZE * SCALE) {
                    for (let x = 0; x < canvas.width; x += TILE_SIZE * SCALE) {
                        ctx.drawImage(
                            tileset,
                            grassTile.x, grassTile.y, grassTile.width, grassTile.height,
                            x, y, TILE_SIZE * SCALE, TILE_SIZE * SCALE
                        );
                    }
                }
            }
            
            // Draw some sample tiles
            const sampleLayout = [
                { tile: 'hq_red', x: 5, y: 3 },
                { tile: 'city_red', x: 3, y: 5 },
                { tile: 'city_red', x: 7, y: 5 },
                { tile: 'base_blue', x: 15, y: 8 },
                { tile: 'airport_green', x: 10, y: 2 },
                { tile: 'mountain', x: 8, y: 6 },
                { tile: 'forest', x: 4, y: 7 },
                { tile: 'forest', x: 6, y: 7 },
                { tile: 'road_h', x: 5, y: 10 },
                { tile: 'road_h', x: 6, y: 10 },
                { tile: 'road_h', x: 7, y: 10 },
                { tile: 'water', x: 12, y: 5 },
                { tile: 'water', x: 13, y: 5 },
                { tile: 'water', x: 12, y: 6 },
                { tile: 'water', x: 13, y: 6 },
            ];
            
            sampleLayout.forEach(item => {
                const tile = tileMapping.tiles[item.tile];
                if (tile) {
                    ctx.drawImage(
                        tileset,
                        tile.x, tile.y, tile.width, tile.height,
                        item.x * TILE_SIZE * SCALE,
                        item.y * TILE_SIZE * SCALE,
                        tile.width * SCALE,
                        tile.height * SCALE
                    );
                }
            });
            
            document.querySelector('.preview-scene').style.display = 'block';
        }
    </script>
</body>
</html>
