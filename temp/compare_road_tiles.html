<!DOCTYPE html>
<html>
<head>
    <title>Compare Road Tiles - Old vs New</title>
    <style>
        body { background: #333; color: white; font-family: Arial; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin: 20px 0; }
        .tileset-section { background: #222; padding: 20px; border-radius: 8px; }
        h2 { text-align: center; margin-bottom: 20px; }
        .tile-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .tile-item { text-align: center; background: #444; padding: 10px; border-radius: 4px; }
        canvas { 
            image-rendering: pixelated; 
            display: block;
            margin: 0 auto 5px;
            border: 1px solid #666;
        }
        .tile-label { font-size: 11px; color: #aaa; }
        .match-info { 
            margin-top: 20px; 
            padding: 15px; 
            background: #2a2a2a; 
            border-radius: 4px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Road Tile Comparison</h1>
        
        <div class="comparison-grid">
            <div class="tileset-section">
                <h2>Old Tileset (Currently Used)</h2>
                <div id="oldTiles" class="tile-grid"></div>
            </div>
            
            <div class="tileset-section">
                <h2>New AW2 Tileset</h2>
                <div id="newTiles" class="tile-grid"></div>
            </div>
        </div>
        
        <div class="match-info">
            <p>Compare the patterns to identify which new tiles match the old ones</p>
        </div>
    </div>

    <script>
        const oldTileset = new Image();
        const newTileset = new Image();
        let loadCount = 0;
        
        // Old road tile positions from templates/tile_sprite_map.json
        const oldRoadTiles = [
            { name: 'ROAD_HORT', x: 238, y: 87 },
            { name: 'ROAD_VERT', x: 255, y: 86 },
            { name: 'ROAD_NE', x: 256, y: 104 },
            { name: 'ROAD_NW', x: 239, y: 104 },
            { name: 'ROAD_SE', x: 256, y: 121 },
            { name: 'ROAD_SW', x: 239, y: 121 },
            { name: 'ESWRoad', x: 273, y: 86 },
            { name: 'WNERoad', x: 290, y: 86 },
            { name: 'NESRoad', x: 274, y: 104 },
            { name: 'SWNRoad', x: 291, y: 104 },
            { name: 'CRoad', x: 307, y: 120 },
            { name: 'HBridge', x: 205, y: 464 },
            { name: 'VBridge', x: 156, y: 464 }
        ];
        
        // New road tile positions (8x4 grid starting at 12,19)
        const newRoadTiles = [];
        for (let row = 0; row < 3; row++) {
            for (let col = 0; col < 8; col++) {
                newRoadTiles.push({
                    name: `Row${row}_Col${col}`,
                    x: 12 + col * 17,
                    y: 19 + row * 17
                });
            }
        }
        
        function drawTile(canvas, img, x, y, size) {
            const ctx = canvas.getContext('2d');
            canvas.width = size * 4;
            canvas.height = size * 4;
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(img, x, y, size, size, 0, 0, canvas.width, canvas.height);
        }
        
        function loadTilesets() {
            oldTileset.onload = () => {
                loadCount++;
                if (loadCount === 2) displayTiles();
            };
            newTileset.onload = () => {
                loadCount++;
                if (loadCount === 2) displayTiles();
            };
            
            oldTileset.src = '/static/img/backup_tilesets_20250718_142606/Advance_Wars_Dual_Strike_Tileset_Normal_Transparent.png';
            newTileset.src = '/static/img/Game Boy Advance - Advance Wars 2 Black Hole Rising - Overworld Tileset Buildings.png';
        }
        
        function displayTiles() {
            // Display old tiles
            const oldContainer = document.getElementById('oldTiles');
            oldRoadTiles.forEach(tile => {
                const item = document.createElement('div');
                item.className = 'tile-item';
                
                const canvas = document.createElement('canvas');
                drawTile(canvas, oldTileset, tile.x, tile.y, 16);
                
                const label = document.createElement('div');
                label.className = 'tile-label';
                label.textContent = tile.name;
                
                item.appendChild(canvas);
                item.appendChild(label);
                oldContainer.appendChild(item);
            });
            
            // Display new tiles
            const newContainer = document.getElementById('newTiles');
            newRoadTiles.forEach(tile => {
                const item = document.createElement('div');
                item.className = 'tile-item';
                
                const canvas = document.createElement('canvas');
                drawTile(canvas, newTileset, tile.x, tile.y, 16);
                
                const label = document.createElement('div');
                label.className = 'tile-label';
                label.textContent = tile.name;
                
                item.appendChild(canvas);
                item.appendChild(label);
                newContainer.appendChild(item);
            });
        }
        
        loadTilesets();
    </script>
</body>
</html>
