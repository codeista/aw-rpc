<!DOCTYPE html>
<html>
<head>
    <title>Unit Sprite Showcase - Advance Wars RPC</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #2c3e50;
            color: #ecf0f1;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1, h2, h3 {
            text-align: center;
        }
        .controls {
            margin: 20px 0;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
        }
        .filter-section {
            margin: 10px 0;
        }
        .filter-label {
            display: inline-block;
            width: 100px;
            font-weight: bold;
        }
        .army-selector {
            padding: 8px 15px;
            margin: 0 10px;
            border-radius: 4px;
            border: 1px solid #7f8c8d;
            background: #34495e;
            color: white;
            cursor: pointer;
        }
        .toggle-button {
            padding: 6px 12px;
            margin: 0 5px;
            border-radius: 4px;
            border: 1px solid #7f8c8d;
            background: #34495e;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }
        .toggle-button:hover {
            background: #4a5f7a;
        }
        .toggle-button.active {
            background: #3498db;
            border-color: #3498db;
        }
        .filter-group {
            display: inline-block;
            margin: 0 10px;
        }
        .sprite-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        .sprite-card {
            background: rgba(0,0,0,0.5);
            border: 1px solid #34495e;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            transition: transform 0.2s;
        }
        .sprite-card:hover {
            transform: scale(1.05);
            border-color: #3498db;
        }
        .sprite-display {
            width: 64px;
            height: 64px;
            margin: 0 auto 10px;
            background: repeating-conic-gradient(#7f8c8d 0% 25%, transparent 0% 50%) 50% / 16px 16px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sprite-canvas {
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }
        .unit-name {
            font-weight: bold;
            color: #3498db;
            margin-bottom: 5px;
            font-size: 12px;
        }
        .sprite-info {
            font-size: 11px;
            color: #95a5a6;
        }
        .category-header {
            grid-column: 1 / -1;
            background: rgba(52, 152, 219, 0.2);
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-size: 18px;
            font-weight: bold;
        }
        .status-section {
            background: rgba(0,0,0,0.3);
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        .name-tiles-grid {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-top: 10px;
        }
        .status-item {
            background: rgba(0,0,0,0.5);
            border: 1px solid #34495e;
            border-radius: 4px;
            padding: 10px;
            text-align: center;
        }
        .status-display {
            width: 32px;
            height: 32px;
            margin: 0 auto 5px;
            background: repeating-conic-gradient(#7f8c8d 0% 25%, transparent 0% 50%) 50% / 8px 8px;
            position: relative;
        }
        .error {
            color: #e74c3c;
            padding: 10px;
            background: rgba(231, 76, 60, 0.2);
            border-radius: 4px;
            text-align: center;
        }
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Unit Sprite Showcase</h1>
        
        <div class="controls">
            <div class="filter-section">
                <span class="filter-label">Armies:</span>
                <div class="filter-group" id="armyFilters">
                    <button class="toggle-button active" data-army="RED">RED</button>
                    <button class="toggle-button active" data-army="BLUE">BLUE</button>
                    <button class="toggle-button active" data-army="GREEN">GREEN</button>
                    <button class="toggle-button active" data-army="YELLOW">YELLOW</button>
                    <button class="toggle-button active" data-army="GREY">GREY</button>
                </div>
                <button class="toggle-button" onclick="toggleAllArmies()">Toggle All</button>
            </div>
            
            <div class="filter-section">
                <span class="filter-label">States:</span>
                <div class="filter-group" id="stateFilters">
                    <button class="toggle-button active" data-state="idle">Idle</button>
                    <button class="toggle-button active" data-state="unavailable">Unavailable</button>
                </div>
            </div>
            
            <div class="filter-section">
                <span class="filter-label">Indicators:</span>
                <div class="filter-group" id="indicatorFilters">
                    <button class="toggle-button active" data-indicator="hp">HP Bars</button>
                    <button class="toggle-button active" data-indicator="status">Status Icons</button>
                </div>
            </div>
        </div>
        
        <div id="unitContainer" class="loading">
            Loading sprites...
        </div>
        
        <div class="status-section">
            <h2>Status Icons & Indicators</h2>
            
            <div>
                <h3>HP Indicators (Available)</h3>
                <div id="hpIndicators" class="status-grid"></div>
            </div>
            
            <div>
                <h3>HP Indicators (Unavailable)</h3>
                <div id="hpUnavailable" class="status-grid"></div>
            </div>
            
            <div>
                <h3>Status Icons</h3>
                <div id="statusIcons" class="status-grid"></div>
            </div>
            
            <div>
                <h3>Unit Name Tiles</h3>
                <div id="nameTiles" class="name-tiles-grid"></div>
            </div>
        </div>
    </div>

    <script>
        // Unit types
        const unitTypes = [
            'INFANTRY', 'MECH', 'RECON', 'TANK', 'MEDIUMTANK', 'NEOTANK',
            'APC', 'ARTILLERY', 'ROCKET', 'ANTIAIR', 'MISSILES',
            'FIGHTER', 'BOMBER', 'BCOPTER', 'TCOPTER',
            'BATTLESHIP', 'CRUISER', 'LANDER', 'SUB',
            'CARRIER', 'MEGATANK', 'BLACKBOAT', 'STEALTH', 'BLACKBOMB', 'PIPERUNNER'
        ];
        
        let spriteSheet = null;
        let legacySpriteSheet = null;  // For status icons/HP indicators
        let spriteMap = null;
        let spriteCorrections = null;
        let activeFilters = {
            armies: ['RED', 'BLUE', 'GREEN', 'YELLOW', 'GREY'],
            states: ['idle', 'unavailable'],
            indicators: ['hp', 'status']
        };
        
        // Toggle button handlers
        function setupToggleButtons() {
            // Army toggles
            document.querySelectorAll('#armyFilters .toggle-button').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.target.classList.toggle('active');
                    updateActiveFilters();
                    displayUnits();
                });
            });
            
            // State toggles
            document.querySelectorAll('#stateFilters .toggle-button').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.target.classList.toggle('active');
                    updateActiveFilters();
                    displayUnits();
                });
            });
            
            // Indicator toggles
            document.querySelectorAll('#indicatorFilters .toggle-button').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.target.classList.toggle('active');
                    updateActiveFilters();
                    displayStatusIndicators();
                });
            });
        }
        
        function updateActiveFilters() {
            // Update armies
            activeFilters.armies = Array.from(
                document.querySelectorAll('#armyFilters .toggle-button.active')
            ).map(btn => btn.dataset.army);
            
            // Update states
            activeFilters.states = Array.from(
                document.querySelectorAll('#stateFilters .toggle-button.active')
            ).map(btn => btn.dataset.state);
            
            // Update indicators
            activeFilters.indicators = Array.from(
                document.querySelectorAll('#indicatorFilters .toggle-button.active')
            ).map(btn => btn.dataset.indicator);
        }
        
        function toggleAllArmies() {
            const armyButtons = document.querySelectorAll('#armyFilters .toggle-button');
            const allActive = Array.from(armyButtons).every(btn => btn.classList.contains('active'));
            
            armyButtons.forEach(btn => {
                if (allActive) {
                    btn.classList.remove('active');
                } else {
                    btn.classList.add('active');
                }
            });
            
            updateActiveFilters();
            displayUnits();
        }
        
        async function loadSprites() {
            try {
                // Load optimized sprite sheet first
                try {
                    const mapResponse = await fetch('/static/img/units_sprite_map_v2.json');
                    spriteMap = await mapResponse.json();
                    
                    // Load sprite sheet image
                    await new Promise((resolve, reject) => {
                        spriteSheet = new Image();
                        spriteSheet.onload = resolve;
                        spriteSheet.onerror = reject;
                        spriteSheet.src = '/static/img/units_sprite_sheet_v2.png';
                    });
                    
                    console.log('Using optimized sprite sheet');
                } catch (error) {
                    console.warn('Optimized sprites not available, using legacy');
                }
                
                // Always load sprite corrections for status icons (with cache bust)
                const timestamp = new Date().getTime();
                const correctionsResponse = await fetch(`/templates/sprite_corrections_config.json?t=${timestamp}`);
                spriteCorrections = await correctionsResponse.json();
                
                // Always load legacy sprite sheet for status icons (they're not in optimized sheet)
                await new Promise((resolve, reject) => {
                    legacySpriteSheet = new Image();
                    legacySpriteSheet.onload = resolve;
                    legacySpriteSheet.onerror = reject;
                    legacySpriteSheet.src = '/static/img/aw2_blackhole_units_map_transparent.png';
                });
                
                setupToggleButtons();
                displayUnits();
                displayStatusIndicators();
                
            } catch (error) {
                document.getElementById('unitContainer').innerHTML = 
                    `<div class="error">Error loading sprites: ${error.message}</div>`;
            }
        }
        
        function getSpriteData(unitType, army, state, frame) {
            if (spriteMap) {
                // Using optimized sprites
                const key = `${unitType}_${army}_${state}_${frame}`;
                return spriteMap.sprites[key];
            } else if (spriteCorrections) {
                // Check in corrections first (for units added via sprite corrector)
                const correctionKey = `${unitType}_${army}_${state}_${frame}`;
                if (spriteCorrections.corrections && 
                    spriteCorrections.corrections[state] && 
                    spriteCorrections.corrections[state][correctionKey]) {
                    return spriteCorrections.corrections[state][correctionKey];
                }
                
                // Then check legacy sprites
                const unitKey = `${unitType}_${army}`;
                const unitData = spriteCorrections.unit_sprites?.[unitKey];
                if (!unitData) {
                    // For special units, they might only be in corrections
                    return null;
                }
                
                const stateKey = `${state}_${frame}`;
                return unitData[stateKey];
            }
            return null;
        }
        
        function drawSprite(canvas, spriteData, scale = 2, useStatusSheet = false, forceSize = null) {
            const sheet = useStatusSheet ? legacySpriteSheet : spriteSheet;
            if (!spriteData || !sheet) return false;
            
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Use forced size if provided, otherwise use sprite data
            const width = forceSize ? forceSize.width : spriteData.width;
            const height = forceSize ? forceSize.height : spriteData.height;
            
            // Set canvas size
            canvas.width = width * scale;
            canvas.height = height * scale;
            
            // Enable pixelated rendering
            ctx.imageSmoothingEnabled = false;
            
            // Draw sprite
            ctx.drawImage(
                sheet,
                spriteData.x, spriteData.y, width, height,
                0, 0, canvas.width, canvas.height
            );
            
            return true;
        }
        
        function displayUnits() {
            const container = document.getElementById('unitContainer');
            container.innerHTML = '';
            container.className = 'sprite-grid';
            
            // Show message if no armies selected
            if (activeFilters.armies.length === 0) {
                container.innerHTML = '<div class="error">No armies selected</div>';
                return;
            }
            
            for (const army of activeFilters.armies) {
                // Add army header
                const header = document.createElement('div');
                header.className = 'category-header';
                header.textContent = `${army} Army`;
                container.appendChild(header);
                
                for (const unitType of unitTypes) {
                    // Skip special units that don't have sprites in the main sheet
                    const specialUnits = ['CARRIER', 'MEGATANK', 'BLACKBOAT', 'STEALTH', 'BLACKBOMB', 'PIPERUNNER'];
                    if (specialUnits.includes(unitType)) {
                        // These units have individual sprite files or are not implemented
                        continue;
                    }
                    
                    // Check if we have this unit for this army
                    const hasIdle = getSpriteData(unitType, army, 'idle', 0);
                    const hasUnavailable = getSpriteData(unitType, army, 'unavailable', 0);
                    
                    if (!hasIdle && !hasUnavailable) continue;
                    
                    // Show idle sprites
                    if (activeFilters.states.includes('idle')) {
                        for (let frame = 0; frame < 3; frame++) {
                            const spriteData = getSpriteData(unitType, army, 'idle', frame);
                            if (spriteData) {
                                createSpriteCard(container, unitType, 'idle', frame, spriteData);
                            }
                        }
                    }
                    
                    // Show unavailable sprites
                    if (activeFilters.states.includes('unavailable')) {
                        for (let frame = 0; frame < 3; frame++) {
                            const spriteData = getSpriteData(unitType, army, 'unavailable', frame);
                            if (spriteData) {
                                createSpriteCard(container, unitType, 'unavailable', frame, spriteData);
                            }
                        }
                    }
                }
            }
        }
        
        function createSpriteCard(container, unitType, state, frame, spriteData) {
            const card = document.createElement('div');
            card.className = 'sprite-card';
            
            const display = document.createElement('div');
            display.className = 'sprite-display';
            
            const canvas = document.createElement('canvas');
            canvas.className = 'sprite-canvas';
            drawSprite(canvas, spriteData);
            display.appendChild(canvas);
            
            const name = document.createElement('div');
            name.className = 'unit-name';
            name.textContent = unitType;
            
            const info = document.createElement('div');
            info.className = 'sprite-info';
            info.textContent = `${state} ${frame}`;
            
            card.appendChild(display);
            card.appendChild(name);
            card.appendChild(info);
            container.appendChild(card);
        }
        
        function displayStatusIndicators() {
            const statusSection = document.querySelector('.status-section');
            
            // Hide entire section if no indicators selected
            if (activeFilters.indicators.length === 0) {
                statusSection.style.display = 'none';
                return;
            }
            statusSection.style.display = 'block';
            
            // HP Indicators (Available)
            const hpContainer = document.getElementById('hpIndicators');
            const hpAvailableSection = hpContainer.parentElement;
            hpContainer.innerHTML = '';
            
            if (activeFilters.indicators.includes('hp')) {
                hpAvailableSection.style.display = 'block';
                for (let i = 0; i <= 9; i++) {
                    const spriteData = spriteCorrections?.corrections?.hp_indicators?.[`hp_indicators_${i}`];
                    if (spriteData) {
                        createStatusItem(hpContainer, `HP ${i}`, spriteData);
                    }
                }
            } else {
                hpAvailableSection.style.display = 'none';
            }
            
            // HP Indicators (Unavailable)
            const hpUnavailContainer = document.getElementById('hpUnavailable');
            const hpUnavailSection = hpUnavailContainer.parentElement;
            hpUnavailContainer.innerHTML = '';
            
            if (activeFilters.indicators.includes('hp')) {
                hpUnavailSection.style.display = 'block';
                
                // Show HP unavailable indicators for each active army
                for (const army of activeFilters.armies) {
                    // Add army header
                    const armyHeader = document.createElement('div');
                    armyHeader.style.gridColumn = '1 / -1';
                    armyHeader.style.fontWeight = 'bold';
                    armyHeader.style.marginTop = '10px';
                    armyHeader.textContent = `${army} Army`;
                    hpUnavailContainer.appendChild(armyHeader);
                    
                    for (let i = 0; i <= 9; i++) {
                        const spriteData = spriteCorrections?.corrections?.hp_unavailable?.[`hp_unavailable_${army}_${i}`];
                        if (spriteData) {
                            createStatusItem(hpUnavailContainer, `HP ${i}`, spriteData);
                        }
                    }
                }
            } else {
                hpUnavailSection.style.display = 'none';
            }
            
            // Status Icons
            const statusContainer = document.getElementById('statusIcons');
            const statusIconSection = statusContainer.parentElement;
            statusContainer.innerHTML = '';
            
            if (activeFilters.indicators.includes('status')) {
                statusIconSection.style.display = 'block';
                const statusNames = ['Load', 'Unload', 'Fuel', 'Submerged'];
                
                // Show status icons for each active army
                for (const army of activeFilters.armies) {
                    // Add army header
                    const armyHeader = document.createElement('div');
                    armyHeader.style.gridColumn = '1 / -1';
                    armyHeader.style.fontWeight = 'bold';
                    armyHeader.style.marginTop = '10px';
                    armyHeader.textContent = `${army} Army`;
                    statusContainer.appendChild(armyHeader);
                    
                    for (let i = 0; i < 4; i++) {
                        const spriteData = spriteCorrections?.corrections?.status_icons?.[`status_icons_${army}_${i}`];
                        if (spriteData) {
                            createStatusItem(statusContainer, statusNames[i] || `Icon ${i}`, spriteData);
                        }
                    }
                }
            } else {
                statusIconSection.style.display = 'none';
            }
            
            // Name Tiles
            const nameContainer = document.getElementById('nameTiles');
            const nameTileSection = nameContainer.parentElement;
            nameContainer.innerHTML = '';
            
            // Always show name tiles from sprite_corrections_config.json
            if (spriteCorrections?.corrections?.name_tiles) {
                const nameTiles = spriteCorrections.corrections.name_tiles;
                
                // Sort by unit type for consistent display
                const sortedEntries = Object.entries(nameTiles).sort((a, b) => {
                    const unitOrder = [
                        'INF', 'MECH', 'RECON', 'TANK', 'MD.TANK', 'NEO.TANK', 'APC', 
                        'ARTILLERY', 'ROCKET', 'ANTI-AIR', 'MISSILE',
                        'B-COPTER', 'T-COPTER', 'FIGHTER', 'BOMBER',
                        'CRUISER', 'BATTLESHIP', 'LANDER', 'SUB',
                        'CARRIER', 'MEGATANK', 'BLACKBOAT', 'STEALTH', 'BLACKBOMB', 'PIPERUNNER'
                    ];
                    const aUnit = a[0].replace('name_', '');
                    const bUnit = b[0].replace('name_', '');
                    return unitOrder.indexOf(aUnit) - unitOrder.indexOf(bUnit);
                });
                
                for (const [key, spriteData] of sortedEntries) {
                    const unitName = key.replace('name_', '');
                    // Use the actual sprite data from the config including position and size
                    createNameTile(nameContainer, unitName, spriteData);
                }
            }
        }
        
        function createStatusItem(container, label, spriteData) {
            const item = document.createElement('div');
            item.className = 'status-item';
            
            const display = document.createElement('div');
            display.className = 'status-display';
            
            const canvas = document.createElement('canvas');
            canvas.className = 'sprite-canvas';
            // Pass force size for 8x8 status icons
            drawSprite(canvas, spriteData, 2, true, {width: 8, height: 8});
            display.appendChild(canvas);
            
            const name = document.createElement('div');
            name.style.fontSize = '11px';
            name.textContent = label;
            
            item.appendChild(display);
            item.appendChild(name);
            container.appendChild(item);
        }
        
        function createNameTile(container, unitName, spriteData) {
            const item = document.createElement('div');
            item.className = 'status-item';
            item.style.width = '100px';
            
            const display = document.createElement('div');
            display.style.width = '64px';  // 32x2
            display.style.height = '32px';  // 16x2
            display.style.margin = '0 auto 5px';
            display.style.background = 'repeating-conic-gradient(#7f8c8d 0% 25%, transparent 0% 50%) 50% / 8px 8px';
            display.style.position = 'relative';
            display.style.display = 'flex';
            display.style.alignItems = 'center';
            display.style.justifyContent = 'center';
            
            const canvas = document.createElement('canvas');
            canvas.className = 'sprite-canvas';
            // Use the actual sprite data dimensions from config
            drawSprite(canvas, spriteData, 2, true);
            display.appendChild(canvas);
            
            const name = document.createElement('div');
            name.style.fontSize = '11px';
            name.textContent = unitName;
            
            item.appendChild(display);
            item.appendChild(name);
            container.appendChild(item);
        }
        
        // Initialize on load
        window.addEventListener('load', loadSprites);
    </script>
</body>
</html>
