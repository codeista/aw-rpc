<!DOCTYPE html>
<html>
<head>
    <title>Road Tiles from Game Tileset</title>
    <style>
        body { background: #333; color: white; font-family: Arial; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; }
        .tileset-section { margin: 30px 0; }
        h2 { color: #8cf; }
        .tile-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .tile-item { 
            background: #222; 
            padding: 10px; 
            border-radius: 4px;
            text-align: center;
            border: 1px solid #555;
        }
        canvas { 
            image-rendering: pixelated; 
            display: block;
            margin: 0 auto 8px;
            border: 1px solid #666;
        }
        .tile-label { 
            font-size: 12px; 
            color: #fff;
            margin-bottom: 3px;
        }
        .coords { 
            font-size: 10px; 
            color: #888; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Road Tiles from Game Tilesets</h1>
        
        <div class="tileset-section">
            <h2>From Default Tileset (AW2 Buildings)</h2>
            <div id="aw2Grid" class="tile-grid"></div>
        </div>
        
        <div class="tileset-section">
            <h2>From Legacy Tileset (AWDS Transparent)</h2>
            <div id="awdsGrid" class="tile-grid"></div>
        </div>
    </div>

    <script>
        // Road tile coordinates from render_legacy.js
        // These use a centered coordinate system with center at (222.5, 581.5)
        const centerX = 222.5;
        const centerY = 581.5;
        const SPRITESIZE = 16;
        
        const roadOffsets = [
            { name: 'ROAD_HORT', xOffset: -42, yOffset: -64 },
            { name: 'ROAD_VERT', xOffset: -59, yOffset: -64 },
            { name: 'ROAD_NW', xOffset: -42, yOffset: -13 },
            { name: 'ROAD_NE', xOffset: -76, yOffset: -13 },
            { name: 'ROAD_SE', xOffset: -76, yOffset: -47 },
            { name: 'ROAD_SW', xOffset: -42, yOffset: -47 },
            { name: 'SWNRoad', xOffset: -93, yOffset: -47 },
            { name: 'NESRoad', xOffset: -110, yOffset: -47 },
            { name: 'WNERoad', xOffset: -110, yOffset: -81 },
            { name: 'ESWRoad', xOffset: -93, yOffset: -81 },
            { name: 'CRoad', xOffset: -59, yOffset: -30 },
            { name: 'HBridge', xOffset: -43, yOffset: -30 },
            { name: 'VBridge', xOffset: -92, yOffset: -30 }
        ];
        
        function displayTiles(tileset, gridId) {
            tileset.onload = function() {
                const grid = document.getElementById(gridId);
                grid.innerHTML = '';
                
                roadOffsets.forEach(road => {
                    // Calculate actual sprite position
                    const x = centerX - SPRITESIZE/2 + road.xOffset;
                    const y = centerY - SPRITESIZE/2 + road.yOffset;
                    
                    const item = document.createElement('div');
                    item.className = 'tile-item';
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = 64;
                    canvas.height = 64;
                    const ctx = canvas.getContext('2d');
                    ctx.imageSmoothingEnabled = false;
                    
                    // Draw the tile
                    ctx.drawImage(tileset, x, y, 16, 16, 0, 0, 64, 64);
                    
                    const label = document.createElement('div');
                    label.className = 'tile-label';
                    label.textContent = road.name;
                    
                    const coords = document.createElement('div');
                    coords.className = 'coords';
                    coords.textContent = `(${Math.round(x)}, ${Math.round(y)})`;
                    
                    item.appendChild(canvas);
                    item.appendChild(label);
                    item.appendChild(coords);
                    grid.appendChild(item);
                });
            };
        }
        
        // Load both tilesets
        const aw2Tileset = new Image();
        const awdsTileset = new Image();
        
        displayTiles(aw2Tileset, 'aw2Grid');
        displayTiles(awdsTileset, 'awdsGrid');
        
        aw2Tileset.src = '/static/img/Game Boy Advance - Advance Wars 2 Black Hole Rising - Overworld Tileset Buildings.png';
        awdsTileset.src = '/static/img/Advance_Wars_Dual_Strike_Tileset_Normal_Transparent.png';
    </script>
</body>
</html>
