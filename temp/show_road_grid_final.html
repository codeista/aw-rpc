<!DOCTYPE html>
<html>
<head>
    <title>Road Tiles - 8x4 Grid</title>
    <style>
        body { background: #333; color: white; font-family: Arial; padding: 20px; }
        .container { text-align: center; }
        .tile-grid { display: inline-block; margin: 20px; background: #222; padding: 10px; }
        .tile-row { display: flex; }
        .tile-item { 
            margin: 5px; 
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .tile-content {
            position: relative;
        }
        .empty-tile {
            background: repeating-linear-gradient(45deg, #444, #444 10px, #333 10px, #333 20px);
            opacity: 0.3;
            width: 60px;
            height: 60px;
        }
        canvas { 
            image-rendering: pixelated; 
            display: block;
            border: 1px solid #555;
        }
        .tile-info {
            text-align: left;
            min-width: 120px;
        }
        .tile-label {
            font-size: 11px;
            color: #fff;
            margin-bottom: 2px;
        }
        .coords {
            font-size: 9px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Road Tiles - 8x4 Grid</h1>
        <p>First tile at (12, 19) - Tiles are 16x16 with 1px separator (17x17 grid)</p>
        <div id="tileGrid" class="tile-grid"></div>
    </div>

    <script>
        const img = new Image();
        img.onload = function() {
            const grid = document.getElementById('tileGrid');
            const tileSize = 16;
            const gridSpacing = 17; // 16 tile + 1 separator
            const startX = 12;
            const startY = 19;
            const scale = 4;
            
            // Road tile names - using null for empty tiles
            const roadLayout = [
                ['ROAD_SE', 'ROAD_HORT', 'ROAD_SW', 'WNERoad', 'ROAD_VERT', 'ROAD_NE', 'ESWRoad', 'SWNRoad'],
                ['ROAD_NW', 'NESRoad', 'CRoad', 'HBridge', 'VBridge', null, null, null],
                [null, null, null, null, null, null, null, null],
                [null, null, null, null, null, null, null, null]
            ];
            
            // Create the grid
            for (let row = 0; row < 4; row++) {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'tile-row';
                
                for (let col = 0; col < 8; col++) {
                    const tileDiv = document.createElement('div');
                    tileDiv.className = 'tile-item';
                    
                    const tileName = roadLayout[row][col];
                    
                    if (tileName) {
                        // Create content container
                        const contentDiv = document.createElement('div');
                        contentDiv.className = 'tile-content';
                        
                        const canvas = document.createElement('canvas');
                        canvas.width = tileSize * scale;
                        canvas.height = tileSize * scale;
                        
                        const ctx = canvas.getContext('2d');
                        ctx.imageSmoothingEnabled = false;
                        
                        // Calculate position
                        const x = startX + (col * gridSpacing);
                        const y = startY + (row * gridSpacing);
                        
                        // Draw the tile
                        ctx.drawImage(img, x, y, tileSize, tileSize, 0, 0, canvas.width, canvas.height);
                        
                        contentDiv.appendChild(canvas);
                        
                        // Create info container
                        const infoDiv = document.createElement('div');
                        infoDiv.className = 'tile-info';
                        
                        // Add label
                        const label = document.createElement('div');
                        label.className = 'tile-label';
                        label.textContent = tileName.replace('ROAD_', '');
                        
                        // Add coordinates
                        const coords = document.createElement('div');
                        coords.className = 'coords';
                        coords.textContent = `(${x}, ${y})`;
                        
                        infoDiv.appendChild(label);
                        infoDiv.appendChild(coords);
                        
                        tileDiv.appendChild(contentDiv);
                        tileDiv.appendChild(infoDiv);
                    } else {
                        // Empty tile
                        const empty = document.createElement('div');
                        empty.className = 'empty-tile';
                        tileDiv.appendChild(empty);
                    }
                    
                    rowDiv.appendChild(tileDiv);
                }
                
                grid.appendChild(rowDiv);
            }
        };
        img.src = '/static/img/Game Boy Advance - Advance Wars 2 Black Hole Rising - Overworld Tileset Buildings.png';
    </script>
</body>
</html>
